name: Images

# Builds the four production images on every pull request that touches them,
# and on main pushes them to GitHub's container registry, tagged with the
# commit SHA (deploy/compose.yaml's TAG) and "main".

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/**/Dockerfile"
      - "apps/**/Dockerfile.dockerignore"
      - "apps/**/.dockerignore"
      - "apps/admin/nginx.conf"
      - "apps/api/composer.lock"
      - "apps/realtime/composer.lock"
      - "apps/web/package-lock.json"
      - "apps/admin/package-lock.json"
      - "deploy/api/**"
      - ".github/workflows/images.yml"

# A newer push to a pull request replaces its run. On main every commit's
# images are finished, so any SHA can be deployed.
concurrency:
  group: images-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: apps/api/Dockerfile
          - image: realtime
            context: .
            file: apps/realtime/Dockerfile
          - image: web
            context: apps/web
            file: apps/web/Dockerfile
          - image: admin
            context: apps/admin
            file: apps/admin/Dockerfile
    env:
      # The website's public settings are compiled in: set them as repository
      # variables (Settings, Secrets and variables, Actions, Variables). Until
      # NEXT_PUBLIC_SITE_URL and, in moyasar mode (the default),
      # NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY are set, the web image is built
      # but not pushed: without the key every card form would be refused.
      PUSH: ${{ github.event_name == 'push' && (matrix.image != 'web' || (vars.NEXT_PUBLIC_SITE_URL != '' && (vars.NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY != '' || (vars.NEXT_PUBLIC_PAYMENTS_MODE || 'moyasar') != 'moyasar'))) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/groupbuy-${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/groupbuy-${{ matrix.image }}:main
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://example.sa' }}
            NEXT_PUBLIC_PAYMENTS_MODE=${{ vars.NEXT_PUBLIC_PAYMENTS_MODE || 'moyasar' }}
            NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_APPLE_PAY_LABEL=${{ vars.NEXT_PUBLIC_APPLE_PAY_LABEL || 'Group Buy' }}
            NEXT_PUBLIC_REVERB_APP_KEY=${{ vars.NEXT_PUBLIC_REVERB_APP_KEY }}
            NEXT_PUBLIC_REVERB_HOST=${{ vars.NEXT_PUBLIC_REVERB_HOST }}
            NEXT_PUBLIC_REVERB_PORT=${{ vars.NEXT_PUBLIC_REVERB_PORT || '443' }}
            NEXT_PUBLIC_REVERB_SCHEME=${{ vars.NEXT_PUBLIC_REVERB_SCHEME || 'https' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
