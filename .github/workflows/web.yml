name: Web

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/openapi/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, unit tests, build and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      API_BASE_URL: http://127.0.0.1:4010
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_PAYMENTS_MODE: fake
      NEXT_PUBLIC_MOYASAR_PUBLISHABLE_KEY: pk_test_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Generated API types match the contract
        run: npm run api:types:check

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests against the contract-checked mock
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/.mock/contract-violations.log
          retention-days: 7
