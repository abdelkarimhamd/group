# The admin portal's static files (apps/admin/Dockerfile). TLS, compression
# and the /api/* route to the API live in the edge proxy (deploy/Caddyfile).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Staff only: keep the portal out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under /assets, so it never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Every other path is a screen of the single-page app.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }
}
