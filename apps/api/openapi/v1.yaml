    post:
      tags: [Admin campaigns]
      operationId: adminCancelCampaign
      summary: Cancel a campaign
      description: |
        Before any capture, cancels at once and voids every hold. Once any
        capture succeeded, money must go back, so this opens an approval
        request for a second admin with the finance role (202) instead.
      x-epic: E7
      x-status: mock
