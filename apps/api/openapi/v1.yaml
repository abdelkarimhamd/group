  # ---------------------------------------------------------------- Webhooks
  /webhooks/moyasar:
    post:
      tags: [Webhooks]
      operationId: receiveMoyasarWebhook
      summary: Moyasar payment events
      description: |
        Called by Moyasar, not by clients. The event's `secret_token` must
        match the token set on the webhook in the Moyasar dashboard (open
        question Q5). Every event is stored, with the token redacted; a
        verified event is processed once per event ID and resends are
        ignored, unless the stored event was never processed, which queues
        it again. The answer is immediate: a queued job fetches the payment
        from Moyasar and applies it exactly as the sync endpoint does, never
        trusting the event body. Bodies over 64 KB are refused (413) and not
        stored.
      x-epic: E9
      x-status: live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Moyasar's event body, stored as received.
      responses:
        '200': {description: 'Accepted, or a duplicate that was ignored.'}
        '401': {description: Verification failed. Logged and never processed.}
        '413': {description: Body too large to be a Moyasar event. Not stored.}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- Admin auth
  /admin/auth/login:
    post:
      tags: [Admin auth]
      operationId: adminLogin
      summary: Admin sign-in, step 1 of 2
      description: |
        Checks email and password, then sends a code to the admin's phone.
        Limited to 5 attempts per email and IP, and 20 per IP, every 15 minutes.
      x-epic: E5
      x-status: live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
      responses:
        '202':
          description: Password accepted; code sent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OtpChallenge'}
        '422':
          description: '`invalid_credentials` or `account_blocked`. `account_blocked` is only returned after a correct password.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: '`sms_unavailable`: the code could not be sent. Try again in a few minutes.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /admin/auth/verify:
    post:
      tags: [Admin auth]
      operationId: adminVerify
      summary: Admin sign-in, step 2 of 2
      description: Returns a token that lasts 12 hours. After 5 wrong codes, start again from step 1.
      x-epic: E5
      x-status: live
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code]
              properties:
                challenge_id: {type: string, format: uuid}
                code: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminSession'}
        '422':
          description: '`otp_invalid`, `otp_expired`, `otp_attempts_exhausted`, or `account_blocked` if the admin was blocked after step 1.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /admin/auth/logout:
    post:
      tags: [Admin auth]
