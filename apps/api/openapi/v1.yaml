  /admin/quotations/{quotation_id}:
    parameters:
      - $ref: '#/components/parameters/QuotationId'
    get:
      tags: [Admin suppliers]
      operationId: adminGetQuotation
      summary: One quotation
      x-epic: E6
      x-status: live
      x-permission: suppliers.view
      security: [{adminToken: []}]
      responses:
        '200':
          description: The quotation.
          content:
