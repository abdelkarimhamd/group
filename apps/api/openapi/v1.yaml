    post:
      tags: [Admin finance]
      operationId: adminRequestLedgerAdjustment
      summary: Ask for a ledger adjustment or reversal
      description: |
        Either balanced `lines` to post (debits equal credits), or the ID of
        a posting to reverse in full. Opens a `ledger_adjustment` approval
        request; nothing reaches the ledger until a second admin with the
        finance role approves it, and then it is posted in that decision.
        Postings are never changed: a wrong adjustment is fixed by reversing
        it. A posting is reversed at most once, and reversals are not
        reversed.
      x-epic: E15
      x-status: live
      x-permission: ledger.adjust
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LedgerAdjustmentInput'}
      responses:
        '201':
          description: Waiting for approval.
          content:
