    patch:
      tags: [Admin suppliers]
      operationId: adminUpdateQuotation
      summary: Update a quotation
      description: |
        Send the whole quotation. Accepting needs a `valid_until` of today or
        later in Riyadh (422 `quotation_expired`) and a supplier that is not
