        (bank, payment fees and recoverable VAT against Moyasar clearing).
        `unmatched_count` counts lines for payments we do not know.
      x-epic: E15
      x-status: live
      x-permission: ledger.view
      security: [{adminToken: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Settlements, newest import first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/MoyasarSettlement'}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /admin/settlements/{settlement_id}/lines:
    parameters:
      - name: settlement_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Admin finance]
      operationId: adminListSettlementLines
      summary: What one settlement paid out
      x-epic: E15
      x-status: live
      x-permission: ledger.view
      security: [{adminToken: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Lines in Moyasar's order.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/MoyasarSettlementLine'}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
components:
  securitySchemes:
    customerToken:
      type: http
      scheme: bearer
      description: Token from `POST /auth/otp/verify`.
    adminToken:
      type: http
      scheme: bearer
      description: Token from `POST /admin/auth/verify`. A customer token is refused here, and the reverse.

  headers:
    XRequestId:
      description: Request ID for support and log searches.
      schema: {type: string, example: 3f6c1d2e-8a4b-4c5d-9e6f-7a8b9c0d1e2f}
    ContentLanguage:
      description: Language of the text in the response.
      schema: {$ref: '#/components/schemas/Locale'}
    RetryAfter:
      description: Seconds until another attempt is allowed.
      schema: {type: integer, example: 60}

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: '`ar` (default) or `en`. Other languages fall back to Arabic.'
      schema: {type: string, example: ar}
    Cursor:
      name: cursor
      in: query
      required: false
      description: '`meta.next_cursor` from the previous page.'
      schema: {type: string}
    PerPage:
      name: per_page
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    AdminId:
      name: admin_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    AddressId:
      name: address_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    CategoryId:
      name: category_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ParticipationId:
      name: participation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    OrderId:
      name: order_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ProductId:
      name: product_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    VariantId:
      name: variant_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    SupplierId:
      name: supplier_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    QuotationId:
      name: quotation_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalRequestId:
      name: approval_request_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    PurchaseOrderId:
      name: purchase_order_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ShipmentId:
      name: shipment_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    ReturnId:
      name: return_id
      in: path
      required: true
      schema: {type: string, format: uuid}

  responses:
    Unauthenticated:
      description: Missing or expired token.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Signed in, but not allowed (for example a missing admin permission).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: No such resource, or not visible to this caller.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: The resource changed or is locked; reload and try again.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InvalidTransition:
      description: '`invalid_transition`: not allowed from the current status.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ValidationFailed:
      description: Invalid input.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AdminCampaignResult:
      description: The campaign after the action.
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {$ref: '#/components/schemas/AdminCampaign'}

  schemas:
    # ------------------------------------------------------------ Shared
    Health:
      type: object
      required: [status, message, checks, time]
      properties:
        status: {type: string, enum: [ok, degraded]}
        message: {type: string, example: جميع الأنظمة تعمل.}
        checks:
          type: object
          required: [database, redis]
          properties:
            database: {type: string, enum: [ok, failing]}
            redis: {type: string, enum: [ok, failing]}
        time: {type: string, format: date-time, example: '2026-11-02T09:00:00Z'}

    Error:
      type: object
      required: [message]
      properties:
        message: {type: string, description: 'Localized, for display.'}
        code: {type: string, description: Stable machine-readable reason.}

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            errors:
              type: object
              description: Field name to messages.
              additionalProperties:
                type: array
                items: {type: string}

    CursorMeta:
      type: object
      required: [next_cursor, per_page]
      properties:
        next_cursor: {type: string, nullable: true, description: Null on the last page.}
        per_page: {type: integer, example: 20}

    Money:
      type: object
      description: An exact amount in minor units. 4900 SAR minor units is 49.00 SAR.
      required: [amount_minor, currency, formatted]
      properties:
        amount_minor: {type: integer, format: int64, example: 6900}
        currency: {type: string, enum: [SAR, USD, CNY], example: SAR}
        formatted: {type: string, example: 69.00 SAR, description: Plain display string; clients may format in Arabic numerals.}

    Locale:
      type: string
      enum: [ar, en]

    SaudiMobile:
      type: string
      description: Saudi mobile number in E.164.
      pattern: '^\+9665[0-9]{8}$'
      example: '+966512345678'

    Actor:
      type: object
      required: [type, id, name]
      properties:
        type: {type: string, enum: [system, admin, user]}
        id: {type: string, format: uuid, nullable: true}
        name: {type: string, nullable: true, example: Sara (Campaigns)}

    ReasonInput:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 1000}

    # ------------------------------------------------------------ Customers
    OtpChallenge:
      type: object
      required: [challenge_id, expires_at, resend_available_at]
      properties:
        challenge_id: {type: string, format: uuid}
        expires_at: {type: string, format: date-time}
        resend_available_at: {type: string, format: date-time}

    CustomerSession:
      type: object
      required: [token, token_type, user, is_new_user]
      properties:
        token: {type: string, example: '1|k9Jx...'}
        token_type: {type: string, enum: [Bearer]}
        user: {$ref: '#/components/schemas/User'}
        is_new_user: {type: boolean}

    User:
      type: object
      required: [id, phone, name, email, locale, privacy_consent, current_privacy_policy_version, created_at]
      properties:
        id: {type: string, format: uuid}
        phone: {$ref: '#/components/schemas/SaudiMobile'}
        name: {type: string, nullable: true, example: نورة}
        email: {type: string, format: email, nullable: true}
        locale: {$ref: '#/components/schemas/Locale'}
        privacy_consent:
          type: object
          nullable: true
          required: [policy_version, accepted_at]
          properties:
            policy_version: {type: string, example: '2026-11'}
            accepted_at: {type: string, format: date-time}
        current_privacy_policy_version: {type: string, example: '2026-11'}
        created_at: {type: string, format: date-time}

    AddressInput:
      type: object
      description: Saudi National Address fields.
      required: [recipient_name, recipient_phone, city, district, street, building_no, postal_code]
      properties:
        recipient_name: {type: string, maxLength: 100}
        recipient_phone: {$ref: '#/components/schemas/SaudiMobile'}
        city: {type: string, maxLength: 100, example: الرياض}
        district: {type: string, maxLength: 100, example: العليا}
        street: {type: string, maxLength: 150}
        building_no: {type: string, pattern: '^[0-9]{4}$', example: '2401'}
        postal_code: {type: string, pattern: '^[0-9]{5}$', example: '12211'}
        additional_no: {type: string, pattern: '^[0-9]{4}$', nullable: true, example: '3344'}
        short_address: {type: string, pattern: '^[A-Z]{4}[0-9]{4}$', nullable: true, example: RRRD2929}
        lat: {type: number, format: double, minimum: -90, maximum: 90, nullable: true}
        lng: {type: number, format: double, minimum: -180, maximum: 180, nullable: true}
        is_default:
          type: boolean
          description: True makes this the default address. The first address is always the default.

    Address:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
        - $ref: '#/components/schemas/AddressInput'

    Category:
      type: object
      required: [id, slug, name, parent_id]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, example: home-kitchen}
        name: {type: string, example: المنزل والمطبخ}
        parent_id: {type: string, format: uuid, nullable: true}

    Image:
      type: object
      required: [url, alt, product_variant_id]
      properties:
        url: {type: string, format: uri, example: 'https://cdn.example.sa/products/kettle-1.webp'}
        alt: {type: string, nullable: true}
        product_variant_id: {type: string, format: uuid, nullable: true}

    Variant:
      type: object
      required: [id, sku, name, option_values]
      properties:
        id: {type: string, format: uuid}
        sku: {type: string, example: KET-17-BLK}
        name: {type: string, example: أسود}
        option_values:
          type: object
          additionalProperties: {type: string}
          example: {color: black}

    PriceTier:
      type: object
      required: [min_qty, max_qty, unit_price, is_current]
      properties:
        min_qty: {type: integer, example: 1}
        max_qty: {type: integer, example: 49}
        unit_price: {$ref: '#/components/schemas/Money'}
        is_current: {type: boolean, description: The tier the next unit sold falls in.}

    CustomerCampaignStatus:
      type: string
      description: |
        Customers never see `draft` or `pending_approval`. Show `purchasing`,
        `fulfilling` and `completed` as a successful deal.
      enum: [scheduled, active, closing, purchasing, fulfilling, completed, failed, cancelled]
      example: active

    CampaignProgress:
      type: object
      required: [campaign_id, status, committed_qty, min_target_qty, max_qty, remaining_qty, units_to_target, deal_confirmed_at, current_unit_price, deadline_at, updated_at, version]
      properties:
        campaign_id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/CustomerCampaignStatus'}
        committed_qty: {type: integer, description: Units with an authorized hold. Pending payments do not count., example: 53}
        min_target_qty: {type: integer, example: 100}
        max_qty: {type: integer, example: 150}
        remaining_qty: {type: integer, description: Units still on sale (max minus committed minus reserved)., example: 95}
        units_to_target: {type: integer, description: 0 once the deal is confirmed., example: 47}
        deal_confirmed_at: {type: string, format: date-time, nullable: true, description: 'Set once the target is reached; show "Deal confirmed". It does not mean the order is placed.'}
        current_unit_price: {$ref: '#/components/schemas/Money'}
        deadline_at: {type: string, format: date-time, example: '2026-11-08T07:00:00Z'}
        updated_at: {type: string, format: date-time, example: '2026-11-02T09:00:00Z'}
        version:
          type: integer
          format: int64
          minimum: 0
          description: Grows with every change to the campaign. Of two payloads for one campaign (a push and a read, say), show the one with the higher version; the same version is the same state. Compare this, not `updated_at`, which has whole seconds only.
          example: 1287

    CampaignSummary:
      type: object
      required: [id, code, title, image, status, starts_at, deadline_at, current_unit_price, lowest_unit_price, progress]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: GB-2611-0007}
        title: {type: string, example: غلاية كهربائية 1.7 لتر}
        image:
          type: object
          allOf: [{$ref: '#/components/schemas/Image'}]
          nullable: true
        status: {$ref: '#/components/schemas/CustomerCampaignStatus'}
        starts_at: {type: string, format: date-time, example: '2026-11-01T07:00:00Z'}
        deadline_at: {type: string, format: date-time, example: '2026-11-08T07:00:00Z'}
        current_unit_price: {$ref: '#/components/schemas/Money'}
        lowest_unit_price: {$ref: '#/components/schemas/Money'}
        progress: {$ref: '#/components/schemas/CampaignProgress'}

    CampaignDetail:
      allOf:
        - $ref: '#/components/schemas/CampaignSummary'
        - type: object
          required: [description, category, variants, images, tiers, per_customer_max_qty, original_deadline_at, final_unit_price, cancellation_rule]
          properties:
            description: {type: string}
            category:
              type: object
              allOf: [{$ref: '#/components/schemas/Category'}]
              nullable: true
            variants:
              type: array
              items: {$ref: '#/components/schemas/Variant'}
            images:
              type: array
              items: {$ref: '#/components/schemas/Image'}
            tiers:
              type: array
              description: Lowest quantity first. Prices never rise with quantity.
              items: {$ref: '#/components/schemas/PriceTier'}
            per_customer_max_qty: {type: integer, nullable: true, description: Total units one customer may hold across joins.}
            original_deadline_at: {type: string, format: date-time, nullable: true, description: Set when the deadline was extended.}
            final_unit_price:
              type: object
              allOf: [{$ref: '#/components/schemas/Money'}]
              nullable: true
              description: Set once the campaign has succeeded (purchasing, fulfilling or completed); everyone pays this. Null while closing and for a failed or cancelled campaign.
            cancellation_rule:
              type: string
              enum: [before_deal_confirmed]
              description: When a customer may cancel a join (proposed rule, open question Q16). Show it before payment.

    JoinRequest:
      type: object
      required: [client_request_id, product_variant_id, quantity, shown_unit_price_halalas, delivery_address_id]
      properties:
        client_request_id:
          type: string
          format: uuid
          description: Generated by the client once per join attempt; reuse it on retries.
        product_variant_id: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1, maximum: 100000, example: 2}
        shown_unit_price_halalas:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: The unit price the customer saw. Compared only; never charged.
          example: 6900
        delivery_address_id: {type: string, format: uuid}

    JoinConflict:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            code: {type: string, enum: [price_changed, sold_out, campaign_not_joinable]}
            current_unit_price:
              allOf: [{$ref: '#/components/schemas/Money'}]
              description: Present with `price_changed`.
            remaining_qty: {type: integer, description: Present with `sold_out`.}

    ParticipationStatus:
      type: string
      enum: [pending_payment, authorized, payment_failed, reservation_expired, cancelled, released, captured, capture_failed]
      example: authorized

    Participation:
      type: object
      required: [id, campaign, product_variant, quantity, status, hold_unit_price, hold_amount, final_unit_price, capture_amount, reservation_expires_at, can_cancel, payment, order_id, created_at]
      properties:
        id: {type: string, format: uuid}
        campaign: {$ref: '#/components/schemas/CampaignSummary'}
        product_variant: {$ref: '#/components/schemas/Variant'}
        quantity: {type: integer, example: 2}
        status: {$ref: '#/components/schemas/ParticipationStatus'}
        hold_unit_price: {$ref: '#/components/schemas/Money'}
        hold_amount:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: The most the customer can be charged. Show that the final charge may be lower.
        final_unit_price:
          type: object
          allOf: [{$ref: '#/components/schemas/Money'}]
          nullable: true
          description: The price every participant paid. Null until this join's hold is captured.
        capture_amount:
          type: object
          allOf: [{$ref: '#/components/schemas/Money'}]
          nullable: true
          description: What was charged. Null until this join's hold is captured, and for a join released or left out at close. The rest of the hold is released, never charged.
        reservation_expires_at: {type: string, format: date-time}
        can_cancel: {type: boolean}
        payment:
          type: object
          allOf: [{$ref: '#/components/schemas/Payment'}]
          nullable: true
          description: The latest payment attempt.
        order_id: {type: string, format: uuid, nullable: true, description: Set once the hold is captured.}
        created_at: {type: string, format: date-time}

    PaymentStatus:
      type: string
      enum: [pending_authorization, authorized, failed, voided, expired, captured, capture_failed, partially_refunded, refunded]
      example: authorized

    PaymentRejectionReason:
      type: string
      description: Why a payment was voided or failed on our side. `capture_declined` and `capture_cutoff_passed` are holds that could not be captured when the campaign closed (the join was left out and the hold voided).
      enum: [declined, amount_mismatch, currency_mismatch, method_not_allowed, not_authorize_only, reservation_expired, campaign_closed, participation_cancelled, duplicate_hold, capture_declined, capture_cutoff_passed]

    Payment:
      type: object
      required: [id, status, amount, captured_amount, refunded_amount, scheme, card_last4, expires_at, rejection_reason, checkout]
      properties:
        id: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        amount: {$ref: '#/components/schemas/Money'}
        captured_amount: {$ref: '#/components/schemas/Money'}
        refunded_amount: {$ref: '#/components/schemas/Money'}
        scheme: {type: string, enum: [mada, visa, mastercard], nullable: true}
        card_last4: {type: string, pattern: '^[0-9]{4}$', nullable: true, example: '4242'}
        expires_at: {type: string, format: date-time, description: When the hold lapses (created + 14 days).}
        rejection_reason:
          type: string
          allOf: [{$ref: '#/components/schemas/PaymentRejectionReason'}]
          nullable: true
        checkout:
          type: object
          allOf: [{$ref: '#/components/schemas/MoyasarCheckout'}]
          nullable: true
          description: Present only while `pending_authorization`.

    MoyasarCheckout:
      type: object
      description: Settings for the Moyasar payment form. Card details are typed only into Moyasar's form.
      required: [publishable_api_key, amount, currency, description, callback_url, methods, supported_networks, manual, metadata]
      properties:
        publishable_api_key: {type: string, example: pk_test_xxxxxxxx}
        amount: {type: integer, description: Halalas; equals the hold amount., example: 13800}
        currency: {type: string, enum: [SAR]}
        description: {type: string, example: GB-2611-0007 x2}
        callback_url: {type: string, format: uri, example: 'https://example.sa/payments/return'}
        methods:
          type: array
          items: {type: string, enum: [creditcard, applepay]}
        supported_networks:
          type: array
          items: {type: string, enum: [mada, visa, mastercard]}
        manual:
          type: boolean
          enum: [true]
          description: Authorize only. A payment captured at once is voided and rejected.
        metadata:
          type: object
          required: [payment_id]
          properties:
            payment_id: {type: string, format: uuid}

    OrderStatus:
      type: string
      enum: [confirmed, processing, ready_to_ship, shipped, delivered, completed, cancelled, return_requested, returned]

    Order:
      type: object
      required: [id, order_number, campaign, product_variant, quantity, unit_price, goods_total, delivery_fee, total, vat, status, shipping_address, payment, shipment, invoices, delivered_at, return_window_ends_at, created_at]
      properties:
        id: {type: string, format: uuid}
        order_number: {type: string, example: ORD-2611-000123}
        campaign: {$ref: '#/components/schemas/CampaignSummary'}
        product_variant: {$ref: '#/components/schemas/Variant'}
        quantity: {type: integer}
        unit_price: {$ref: '#/components/schemas/Money'}
        goods_total: {$ref: '#/components/schemas/Money'}
        delivery_fee: {$ref: '#/components/schemas/Money'}
        total:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: Equals the amount captured.
        vat:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: The 15% VAT contained in the total.
        status: {$ref: '#/components/schemas/OrderStatus'}
        shipping_address: {$ref: '#/components/schemas/AddressInput'}
        payment:
          type: object
          required: [status, captured_amount, refunded_amount]
          properties:
            status: {$ref: '#/components/schemas/PaymentStatus'}
            captured_amount: {$ref: '#/components/schemas/Money'}
            refunded_amount: {$ref: '#/components/schemas/Money'}
        shipment:
          type: object
          allOf: [{$ref: '#/components/schemas/Shipment'}]
          nullable: true
          description: The newest parcel the courier has collected; a booking not yet collected is not shown.
        invoices:
          type: array
          items: {$ref: '#/components/schemas/InvoiceRef'}
        delivered_at: {type: string, format: date-time, nullable: true}
        return_window_ends_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    InvoiceRef:
      type: object
      required: [id, type, invoice_number, issued_at, total, pdf_url]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [simplified_tax_invoice, credit_note]}
        invoice_number: {type: string, example: INV-2026-000123}
        issued_at: {type: string, format: date-time}
        total: {$ref: '#/components/schemas/Money'}
        pdf_url: {type: string, format: uri, nullable: true, description: 'The Arabic and English PDF, with the ZATCA QR code: a signed link that works for 30 minutes. Null for the moment between issue and the queued render.'}

    ShipmentStatus:
      type: string
      enum: [pending, picked_up, in_transit, out_for_delivery, delivered, failed_attempt, returned, cancelled]

    Shipment:
      type: object
      required: [id, courier, tracking_number, tracking_url, status, shipped_at, delivered_at, events]
      properties:
        id: {type: string, format: uuid}
        courier: {type: string, example: SMSA}
        tracking_number: {type: string}
        tracking_url: {type: string, format: uri, nullable: true}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        shipped_at: {type: string, format: date-time, nullable: true}
        delivered_at: {type: string, format: date-time, nullable: true}
        events:
          type: array
          description: Oldest first.
          items:
            type: object
            required: [status, description, location, occurred_at]
            properties:
              status: {$ref: '#/components/schemas/ShipmentStatus'}
              description: {type: string, nullable: true}
              location: {type: string, nullable: true}
              occurred_at: {type: string, format: date-time}

    # ------------------------------------------------------------ Admin
    AdminSession:
      type: object
      required: [token, token_type, admin]
      properties:
        token: {type: string}
        token_type: {type: string, enum: [Bearer]}
        admin: {$ref: '#/components/schemas/AdminUser'}

    AdminRoleName:
      type: string
      enum: [super_admin, sourcing, campaign_manager, finance, operations, support]

    AdminRole:
      type: object
      required: [name, permissions, grantable]
      properties:
        name: {$ref: '#/components/schemas/AdminRoleName'}
        permissions:
          type: array
          items: {$ref: '#/components/schemas/AdminPermission'}
        grantable:
          type: boolean
          description: Whether the signed-in admin holds every permission of this role, and so can grant it.

    AdminPermission:
      type: string
      description: |
        What an admin may do. Each admin operation names the one it needs in
        `x-permission`. `approvals.decide` belongs to finance only, not to
        super_admin, so releasing money always takes finance; nobody can grant
        a role with permissions they lack, so a super admin cannot make
        themselves finance.
      enum:
        - catalog.view
        - catalog.edit
        - suppliers.view
        - suppliers.edit
        - suppliers.approve
        - campaigns.view
        - campaigns.edit
        - pricing.edit
        - campaigns.approve
        - campaigns.override_margin
        - campaigns.extend
        - campaigns.cancel
        - campaigns.close
        - payments.view
        - refunds.request
        - payments.void
        - approvals.view
        - approvals.decide
        - orders.view
        - fulfilment.edit
        - purchasing.view
        - purchasing.edit
        - reconciliation.view
        - reconciliation.resolve
        - audit.view
        - ledger.view
        - ledger.adjust
        - admins.manage

    AdminUser:
      type: object
      required: [id, email, name, phone, status, roles, permissions, last_login_at, created_at]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        name: {type: string, example: Sara Alqahtani}
        phone:
          allOf:
            - $ref: '#/components/schemas/SaudiMobile'
          description: Receives the sign-in codes.
        status: {type: string, enum: [active, blocked]}
        roles:
          type: array
          items: {$ref: '#/components/schemas/AdminRoleName'}
          example: [finance]
        permissions:
          type: array
          description: Everything the admin's roles allow. Use this, not role names, to decide what to show.
          items: {$ref: '#/components/schemas/AdminPermission'}
          example: [approvals.decide, approvals.view, campaigns.approve, campaigns.view, payments.view]
        last_login_at: {type: string, format: date-time, nullable: true}
        created_at: {type: string, format: date-time}

    AdminCreateInput:
      type: object
      required: [email, name, phone, roles, password]
      properties:
        email: {type: string, format: email, maxLength: 191}
        name: {type: string, maxLength: 100, example: Sara Alqahtani}
        phone: {$ref: '#/components/schemas/SaudiMobile'}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/AdminRoleName'}
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          description: Share it with the new admin privately. They can change it with `POST /admin/me/password`.

    AdminUpdateInput:
      type: object
      minProperties: 1
      properties:
        name: {type: string, maxLength: 100}
        phone: {$ref: '#/components/schemas/SaudiMobile'}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/AdminRoleName'}
        status: {type: string, enum: [active, blocked]}
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 200
          description: Sets a new password, for an admin who forgot theirs.

    AdminCategoryInput:
      type: object
      required: [slug, name_ar, name_en]
      properties:
        slug: {type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name_ar: {type: string, maxLength: 100}
        name_en: {type: string, maxLength: 100}
        parent_id: {type: string, format: uuid, nullable: true}
        sort_order: {type: integer, minimum: 0, default: 0}

    AdminCategory:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
        - $ref: '#/components/schemas/AdminCategoryInput'

    AdminProductInput:
      type: object
      required: [category_id, name_ar, name_en, alibaba_url]
      properties:
        category_id: {type: string, format: uuid}
        name_ar: {type: string, maxLength: 200}
        name_en: {type: string, maxLength: 200}
        description_ar: {type: string, maxLength: 10000, nullable: true}
        description_en: {type: string, maxLength: 10000, nullable: true}
        alibaba_url: {type: string, format: uri}
        hs_code: {type: string, pattern: '^[0-9]{6,12}$', nullable: true, example: '851610'}
        status: {type: string, enum: [draft, active, archived]}

    AdminProduct:
      allOf:
        - $ref: '#/components/schemas/AdminProductInput'
        - type: object
          required: [id, status, variants, images, created_at, updated_at]
          properties:
            id: {type: string, format: uuid}
            variants:
              type: array
              items: {$ref: '#/components/schemas/AdminVariant'}
            images:
              type: array
              items: {$ref: '#/components/schemas/AdminImage'}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}

    AdminVariantInput:
      type: object
      required: [sku, name_ar, name_en]
      properties:
        sku: {type: string, maxLength: 64, pattern: '^[A-Za-z0-9._/-]+$'}
        name_ar: {type: string, maxLength: 100}
        name_en: {type: string, maxLength: 100}
        option_values:
          type: object
          maxProperties: 10
          description: Keys are lowercase identifiers matching `^[a-z][a-z0-9_]{0,49}$`, such as `color`.
          additionalProperties: {type: string, maxLength: 100}
        weight_grams: {type: integer, minimum: 0, maximum: 10000000, nullable: true}
        length_mm: {type: integer, minimum: 0, maximum: 10000000, nullable: true}
        width_mm: {type: integer, minimum: 0, maximum: 10000000, nullable: true}
        height_mm: {type: integer, minimum: 0, maximum: 10000000, nullable: true}
        status: {type: string, enum: [active, archived], description: 'Defaults to `active` on create; left out on update, it keeps its current value.'}

    AdminVariant:
      allOf:
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
        - $ref: '#/components/schemas/AdminVariantInput'

    AdminImage:
      type: object
      required: [id, url, product_variant_id, alt_ar, alt_en, sort_order]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, format: uri}
        product_variant_id: {type: string, format: uuid, nullable: true}
        alt_ar: {type: string, nullable: true}
        alt_en: {type: string, nullable: true}
        sort_order: {type: integer}

    SupplierInput:
      type: object
      required: [name, alibaba_store_url, country]
      properties:
        name: {type: string, maxLength: 200}
        alibaba_store_url: {type: string, format: uri}
        country: {type: string, pattern: '^[A-Z]{2}$', example: CN}
        contact_name: {type: string, maxLength: 100, nullable: true}
        contact_channel: {type: string, maxLength: 200, nullable: true, example: 'Alibaba chat'}
        quality_rating: {type: integer, minimum: 1, maximum: 5, nullable: true}
        review_notes: {type: string, maxLength: 5000, nullable: true}

    SupplierReviewInput:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [prospect, approved, blocked]}
        quality_rating: {type: integer, minimum: 1, maximum: 5, nullable: true}
        review_notes: {type: string, maxLength: 5000, nullable: true}

    Supplier:
      allOf:
        - $ref: '#/components/schemas/SupplierInput'
        - type: object
          required: [id, status, reviewed_by, reviewed_at]
          properties:
            id: {type: string, format: uuid}
            status: {type: string, enum: [prospect, approved, blocked]}
            reviewed_by:
              type: object
              allOf: [{$ref: '#/components/schemas/Actor'}]
              nullable: true
            reviewed_at: {type: string, format: date-time, nullable: true}

    LandedCostBreakdownInput:
      type: object
      description: Per unit, in halalas.
      required: [product_halalas, freight_halalas, customs_duty_halalas, import_vat_halalas, clearance_halalas, last_mile_halalas]
      properties:
        product_halalas: {type: integer, minimum: 0}
        freight_halalas: {type: integer, minimum: 0}
        customs_duty_halalas: {type: integer, minimum: 0}
        import_vat_halalas: {type: integer, minimum: 0, description: Whether this belongs here is open with the tax adviser.}
        clearance_halalas: {type: integer, minimum: 0}
        last_mile_halalas: {type: integer, minimum: 0}

    QuotationInput:
      type: object
      required: [supplier_id, product_id, moq, unit_cost_minor, currency, shipping_terms, lead_time_days, valid_until, fx_rate_to_sar, landed_cost_basis_qty, landed_cost_breakdown]
      properties:
        supplier_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        product_variant_id: {type: string, format: uuid, nullable: true, description: Null when the quote covers every variant.}
        moq: {type: integer, minimum: 1}
        unit_cost_minor: {type: integer, minimum: 1, description: "In the supplier's currency (USD cents, for example)."}
        currency: {type: string, enum: [USD, CNY, SAR]}
        shipping_terms: {type: string, maxLength: 20, example: FOB}
        lead_time_days: {type: integer, minimum: 0}
        valid_until: {type: string, format: date}
        fx_rate_to_sar:
          type: string
          pattern: '^[0-9]{1,10}(\.[0-9]{1,8})?$'
          description: Decimal string, never a float. SAR per unit of `currency`.
          example: '3.75000000'
        landed_cost_basis_qty: {type: integer, minimum: 1}
        landed_cost_breakdown: {$ref: '#/components/schemas/LandedCostBreakdownInput'}

    Quotation:
      type: object
      required: [id, supplier_id, product_id, product_variant_id, moq, unit_cost, shipping_terms, lead_time_days, valid_until, fx_rate_to_sar, landed_cost_basis_qty, landed_cost_breakdown, landed_cost_per_unit, attachment_url, status, used_by_campaign_ids]
      properties:
        id: {type: string, format: uuid}
        supplier_id: {type: string, format: uuid}
        product_id: {type: string, format: uuid}
        product_variant_id: {type: string, format: uuid, nullable: true}
        moq: {type: integer}
        unit_cost: {$ref: '#/components/schemas/Money'}
        shipping_terms: {type: string}
        lead_time_days: {type: integer}
        valid_until: {type: string, format: date}
        fx_rate_to_sar: {type: string, example: '3.75000000'}
        landed_cost_basis_qty: {type: integer}
        landed_cost_breakdown:
          type: object
          required: [product, freight, customs_duty, import_vat, clearance, last_mile]
          properties:
            product: {$ref: '#/components/schemas/Money'}
            freight: {$ref: '#/components/schemas/Money'}
            customs_duty: {$ref: '#/components/schemas/Money'}
            import_vat: {$ref: '#/components/schemas/Money'}
            clearance: {$ref: '#/components/schemas/Money'}
            last_mile: {$ref: '#/components/schemas/Money'}
        landed_cost_per_unit: {$ref: '#/components/schemas/Money'}
        attachment_url: {type: string, format: uri, nullable: true}
        status: {type: string, enum: [draft, accepted, rejected, expired]}
        used_by_campaign_ids:
          type: array
          items: {type: string, format: uuid}

    CampaignStatus:
      type: string
      enum: [draft, pending_approval, scheduled, active, closing, purchasing, fulfilling, completed, failed, cancelled]
      example: active

    ClosingStep:
      type: string
      enum: [settling_joins, awaiting_supplier, capturing, needs_admin, notifying, done]

    AdminCampaignInput:
      type: object
      required: [product_id, supplier_quotation_id, title_ar, title_en, product_variant_ids, min_target_qty, max_qty, starts_at]
      properties:
        product_id: {type: string, format: uuid}
        supplier_quotation_id: {type: string, format: uuid}
        title_ar: {type: string, maxLength: 200}
        title_en: {type: string, maxLength: 200}
        product_variant_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: {type: string, format: uuid}
          description: Every variant counts toward one shared target and maximum.
        min_target_qty: {type: integer, minimum: 1, maximum: 100000}
        max_qty: {type: integer, minimum: 1, maximum: 100000, description: Must be at least `min_target_qty`.}
        per_customer_max_qty: {type: integer, minimum: 1, nullable: true, description: At most `max_qty`.}
        starts_at: {type: string, format: date-time, description: 'The deadline is set at approval, 7 days after the start.'}
        delivery_mode: {type: string, enum: [warehouse], default: warehouse, description: '`direct` comes after the pilot.'}

    AdminTier:
      type: object
      required: [min_qty, max_qty, unit_price]
      properties:
        min_qty: {type: integer}
        max_qty: {type: integer}
        unit_price: {$ref: '#/components/schemas/Money'}

    TierSetInput:
      type: object
      required: [lock_version, tiers]
      properties:
        lock_version: {type: integer}
        reason: {type: string, maxLength: 1000, nullable: true, description: Required from version 2.}
        tiers:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            required: [min_qty, max_qty, unit_price_halalas]
            properties:
              min_qty: {type: integer, minimum: 1, maximum: 100000}
              max_qty: {type: integer, minimum: 1, maximum: 100000}
              unit_price_halalas: {type: integer, minimum: 1, maximum: 1000000000, description: VAT-inclusive.}

    AdminCampaign:
      type: object
      required: [id, code, status, product, supplier, supplier_quotation_id, title_ar, title_en, variants, min_target_qty, max_qty, committed_qty, reserved_qty, per_customer_max_qty, starts_at, deadline_at, original_deadline_at, extended_at, extension_reason, deal_confirmed_at, close_reason, closing_step, closed_at, final_qty, final_unit_price, capture_by, supplier_decision_due_at, captured_qty, end_reason, tier_version, tiers, landed_cost_per_unit, delivery_mode, created_by, approved_by, approved_at, lock_version, available_actions]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, example: GB-2611-0007}
        status: {$ref: '#/components/schemas/CampaignStatus'}
        product:
          type: object
          required: [id, name_ar, name_en]
          properties:
            id: {type: string, format: uuid}
            name_ar: {type: string}
            name_en: {type: string}
        supplier:
          type: object
          required: [id, name, moq]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
            moq: {type: integer, description: From the campaign's quotation.}
        supplier_quotation_id: {type: string, format: uuid}
        title_ar: {type: string}
        title_en: {type: string}
        variants:
          type: array
          items: {$ref: '#/components/schemas/AdminVariant'}
        min_target_qty: {type: integer}
        max_qty: {type: integer}
        committed_qty: {type: integer}
        reserved_qty: {type: integer}
        per_customer_max_qty: {type: integer, nullable: true}
        starts_at: {type: string, format: date-time}
        deadline_at: {type: string, format: date-time, nullable: true, description: Null until approval.}
        original_deadline_at: {type: string, format: date-time, nullable: true}
        extended_at: {type: string, format: date-time, nullable: true}
        extension_reason: {type: string, nullable: true}
        deal_confirmed_at: {type: string, format: date-time, nullable: true}
        close_reason: {type: string, enum: [deadline, max_reached], nullable: true}
        closing_step:
          type: string
          allOf: [{$ref: '#/components/schemas/ClosingStep'}]
          nullable: true
        closed_at: {type: string, format: date-time, nullable: true}
        final_qty: {type: integer, nullable: true}
        final_unit_price:
          type: object
          allOf: [{$ref: '#/components/schemas/Money'}]
          nullable: true
        capture_by: {type: string, format: date-time, nullable: true, description: Earliest capture cutoff among the holds.}
        supplier_decision_due_at: {type: string, format: date-time, nullable: true, description: '`capture_by` minus 24 hours, while awaiting the supplier.'}
        captured_qty: {type: integer, nullable: true}
        end_reason:
          type: string
          nullable: true
          description: The admin's reason for a cancellation; for a failure, one of target_missed, supplier_rejected, no_supplier_decision or captures_failed.
        tier_version: {type: integer, nullable: true, description: Null until the first tier set is saved.}
        tiers:
          type: array
          items: {$ref: '#/components/schemas/AdminTier'}
        landed_cost_per_unit: {$ref: '#/components/schemas/Money'}
        delivery_mode: {type: string, enum: [warehouse, direct]}
        created_by: {$ref: '#/components/schemas/Actor'}
        approved_by:
          type: object
          allOf: [{$ref: '#/components/schemas/Actor'}]
          nullable: true
        approved_at: {type: string, format: date-time, nullable: true}
        lock_version: {type: integer}
        available_actions:
          type: array
          description: Actions this admin may take now, given status and permissions.
          items: {type: string, enum: [edit, edit_tiers, submit, approve, reject, extend, cancel, record_supplier_decision, decide_below_target]}

    MarginReport:
      type: object
      required: [min_margin_bp, passes, landed_cost_per_unit, payment_fee_estimate, delivery_cost_estimate, tiers, warnings]
      properties:
        min_margin_bp: {type: integer, example: 1500, description: 1500 is 15%.}
        passes: {type: boolean}
        landed_cost_per_unit: {$ref: '#/components/schemas/Money'}
        payment_fee_estimate:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: Per unit, worked out on the highest tier price so it is never understated.
        delivery_cost_estimate: {$ref: '#/components/schemas/Money'}
        tiers:
          type: array
          items:
            type: object
            required: [min_qty, max_qty, unit_price, net_price, margin, margin_bp, passes]
            properties:
              min_qty: {type: integer}
              max_qty: {type: integer}
              unit_price: {$ref: '#/components/schemas/Money'}
              net_price:
                allOf: [{$ref: '#/components/schemas/Money'}]
                description: Price without VAT.
              margin: {$ref: '#/components/schemas/Money'}
              margin_bp: {type: integer, description: 'Margin as a share of the net price, in basis points.'}
              passes: {type: boolean}
        warnings:
          type: array
          items: {type: string, enum: [min_target_below_supplier_moq, target_at_lowest_tier_boundary, quotation_expires_before_capture]}

    MarginBlockedError:
      allOf:
        - $ref: '#/components/schemas/ValidationError'
        - type: object
          properties:
            margin: {$ref: '#/components/schemas/MarginReport'}

    ExtensionWindow:
      type: object
      required: [allowed, blocked_reason, latest_allowed_deadline_at, earliest_hold_expires_at]
      properties:
        allowed: {type: boolean}
        blocked_reason:
          type: string
          nullable: true
          enum: [not_active, already_extended, deal_confirmed, deadline_passed, no_room_before_hold_expiry]
        latest_allowed_deadline_at: {type: string, format: date-time, nullable: true}
        earliest_hold_expires_at: {type: string, format: date-time, nullable: true}

    ExtensionBlockedError:
      allOf:
        - $ref: '#/components/schemas/ValidationError'
        - type: object
          properties:
            window: {$ref: '#/components/schemas/ExtensionWindow'}

    SupplierDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [confirmed, rejected]}
        unit_cost_minor: {type: integer, minimum: 1, maximum: 100000000000, description: Required when confirmed. In the minor unit of `currency`.}
        currency:
          type: string
          enum: [USD, CNY, SAR]
          nullable: true
          description: The supplier's currency; the quotation's when left out.
        available_qty: {type: integer, minimum: 0, maximum: 10000000, description: Required when confirmed; must cover the final quantity.}
        quotation_reference: {type: string, maxLength: 200, nullable: true}
        note: {type: string, maxLength: 2000, nullable: true}

    CampaignEvent:
      type: object
      required: [id, event_type, from_status, to_status, committed_qty_after, payload, actor, occurred_at]
      properties:
        id: {type: string, format: uuid}
        event_type:
          type: string
          example: price_changed
          description: For example submitted, approved, published, joined, join_cancelled, deal_confirmed, price_changed (the final price has `final` true), max_reached, tiers_changed, extended, closed, awaiting_supplier, supplier_confirmed, supplier_rejected, needs_admin, below_target_decision, cancellation_requested, captures_completed, supplier_shipped, goods_received, completed, failed, cancelled.
        from_status:
          type: string
          allOf: [{$ref: '#/components/schemas/CampaignStatus'}]
          nullable: true
        to_status:
          type: string
          allOf: [{$ref: '#/components/schemas/CampaignStatus'}]
          nullable: true
        committed_qty_after: {type: integer}
        payload: {type: object, additionalProperties: true}
        actor: {$ref: '#/components/schemas/Actor'}
        occurred_at: {type: string, format: date-time}

    AdminParticipation:
      type: object
      required: [id, customer, product_variant, quantity, status, hold_unit_price, hold_amount, final_unit_price, capture_amount, payment, created_at]
      properties:
        id: {type: string, format: uuid}
        customer:
          type: object
          required: [id, name, phone]
          properties:
            id: {type: string, format: uuid}
            name: {type: string, nullable: true}
            phone: {type: string, description: 'Masked, for example +9665******78.'}
        product_variant: {$ref: '#/components/schemas/AdminVariant'}
        quantity: {type: integer}
        status: {$ref: '#/components/schemas/ParticipationStatus'}
        hold_unit_price: {$ref: '#/components/schemas/Money'}
        hold_amount: {$ref: '#/components/schemas/Money'}
        final_unit_price:
          type: object
          allOf: [{$ref: '#/components/schemas/Money'}]
          nullable: true
        capture_amount:
          type: object
          allOf: [{$ref: '#/components/schemas/Money'}]
          nullable: true
        payment:
          type: object
          allOf: [{$ref: '#/components/schemas/AdminPayment'}]
          nullable: true
        created_at: {type: string, format: date-time}

    AdminPayment:
      type: object
      required: [id, participation_id, campaign, provider_payment_id, source_type, scheme, card_last4, status, rejection_reason, authorized_amount, captured_amount, refunded_amount, expires_at, capture_cutoff_at, authorized_at, captured_at, voided_at, provider_status, last_synced_at, void_requestable, transactions]
      properties:
        id: {type: string, format: uuid}
        participation_id: {type: string, format: uuid}
        campaign:
          type: object
          required: [id, code]
          properties:
            id: {type: string, format: uuid}
            code: {type: string}
        provider_payment_id: {type: string, nullable: true}
        source_type: {type: string, enum: [creditcard, applepay], nullable: true, description: Null until Moyasar reports the payment.}
        scheme: {type: string, enum: [mada, visa, mastercard], nullable: true}
        card_last4: {type: string, nullable: true}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        rejection_reason:
          type: string
          allOf: [{$ref: '#/components/schemas/PaymentRejectionReason'}]
          nullable: true
        authorized_amount: {$ref: '#/components/schemas/Money'}
        captured_amount: {$ref: '#/components/schemas/Money'}
        refunded_amount: {$ref: '#/components/schemas/Money'}
        expires_at: {type: string, format: date-time}
        capture_cutoff_at: {type: string, format: date-time, description: '`expires_at` minus 24 hours. No capture after this.'}
        authorized_at: {type: string, format: date-time, nullable: true}
        captured_at: {type: string, format: date-time, nullable: true}
        voided_at: {type: string, format: date-time, nullable: true}
        provider_status: {type: string, nullable: true, description: Last status seen at Moyasar.}
        last_synced_at: {type: string, format: date-time, nullable: true}
        void_requestable:
          type: boolean
          nullable: true
          description: Whether a hold Moyasar still keeps may be released (`POST /admin/payments/{id}/void`). Null in lists.
        transactions:
          type: array
          description: Every call to Moyasar, oldest first. Empty in list responses.
          items: {$ref: '#/components/schemas/PaymentTransaction'}

    PaymentTransaction:
      type: object
      required: [id, type, amount, idempotency_key, status, provider_reference, error_code, error_message, requested_by, created_at, completed_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [authorize, capture, void, refund]}
        amount: {$ref: '#/components/schemas/Money'}
        idempotency_key: {type: string, example: 'capture:0f8f3c3e-6d1b-4c55-9d0f-4d6c3e2b1a90'}
        status: {type: string, enum: [pending, succeeded, failed]}
        provider_reference: {type: string, nullable: true}
        error_code: {type: string, nullable: true}
        error_message: {type: string, nullable: true}
        requested_by: {$ref: '#/components/schemas/Actor'}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time, nullable: true}

    RefundStatus:
      type: string
      enum: [pending_approval, approved, processing, succeeded, failed, rejected]

    RefundReason:
      type: string
      enum: [customer_cancellation, delivery_delay, defective, shortage, campaign_cancelled_after_capture, customer_return, other]

    RefundInput:
      type: object
      required: [payment_id, amount_halalas, reason]
      properties:
        payment_id: {type: string, format: uuid}
        customer_order_id: {type: string, format: uuid, nullable: true}
        amount_halalas: {type: integer, minimum: 1}
        reason: {$ref: '#/components/schemas/RefundReason'}
        note: {type: string, maxLength: 2000, nullable: true}

    Refund:
      type: object
      required: [id, payment_id, customer_order_id, amount, method, reason, status, provider_refund_id, approval_request_id, credit_note_id, requested_by, created_at, processed_at]
      properties:
        id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid}
        customer_order_id: {type: string, format: uuid, nullable: true}
        amount: {$ref: '#/components/schemas/Money'}
        method: {type: string, enum: [void, refund], description: '`void` only for a full refund within about 2 hours of capture.'}
        reason: {$ref: '#/components/schemas/RefundReason'}
        status: {$ref: '#/components/schemas/RefundStatus'}
        provider_refund_id: {type: string, nullable: true}
        approval_request_id: {type: string, format: uuid, nullable: true}
        credit_note_id: {type: string, format: uuid, nullable: true}
        requested_by: {$ref: '#/components/schemas/Actor'}
        created_at: {type: string, format: date-time}
        processed_at: {type: string, format: date-time, nullable: true}

    ApprovalRequest:
      type: object
      required: [id, type, subject_type, subject_id, payload, status, requested_by, decided_by, reason, created_at, decided_at]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [manual_refund, manual_capture, manual_void, ledger_adjustment, campaign_cancellation]}
        subject_type: {type: string, example: refund}
        subject_id: {type: string, format: uuid}
        payload: {type: object, additionalProperties: true}
        status: {type: string, enum: [pending, approved, rejected, cancelled]}
        requested_by: {$ref: '#/components/schemas/Actor'}
        decided_by:
          type: object
          allOf: [{$ref: '#/components/schemas/Actor'}]
          nullable: true
        reason: {type: string, nullable: true}
        created_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time, nullable: true}

    AdminOrder:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [customer, participation_id, payment_id, refunds, shipments, return]
          properties:
            customer:
              type: object
              required: [id, name, phone]
              properties:
                id: {type: string, format: uuid}
                name: {type: string, nullable: true}
                phone: {$ref: '#/components/schemas/SaudiMobile'}
            participation_id: {type: string, format: uuid}
            payment_id: {type: string, format: uuid}
            refunds:
              type: array
              items: {$ref: '#/components/schemas/Refund'}
            shipments:
              type: array
              description: Every shipment, newest first, including parcels brought back and bookings called off.
              items: {$ref: '#/components/schemas/AdminShipment'}
            return:
              type: object
              allOf: [{$ref: '#/components/schemas/OrderReturn'}]
              nullable: true

    AdminShipment:
      type: object
      required: [id, courier, tracking_number, tracking_url, status, shipped_at, delivered_at, booking, created_at, events]
      properties:
        id: {type: string, format: uuid}
        courier: {type: string, example: Aramex}
        tracking_number: {type: string, nullable: true, description: Null only while a booking waits for the courier's answer.}
        tracking_url: {type: string, format: uri, nullable: true}
        status: {$ref: '#/components/schemas/ShipmentStatus'}
        shipped_at: {type: string, format: date-time, nullable: true, description: When the courier collected it.}
        delivered_at: {type: string, format: date-time, nullable: true}
        booking:
          type: object
          nullable: true
          description: Null when the parcel was handed over by hand.
          required: [status, reference, requested_at, error, label_url]
          properties:
            status: {type: string, enum: [requested, booked, failed]}
            reference: {type: string, format: uuid, description: Our reference sent to the courier with the booking.}
            requested_at: {type: string, format: date-time}
            error: {type: string, nullable: true, description: "Why the booking failed; the shipment is then cancelled."}
            label_url: {type: string, format: uri, nullable: true, description: "The courier's label as PDF: a signed link that works for 30 minutes."}
        created_at: {type: string, format: date-time}
        events:
          type: array
          description: Oldest first.
          items:
            type: object
            required: [status, description, location, source, occurred_at]
            properties:
              status: {$ref: '#/components/schemas/ShipmentStatus'}
              description: {type: string, nullable: true}
              location: {type: string, nullable: true}
              source: {type: string, enum: [admin, courier_api]}
              occurred_at: {type: string, format: date-time}

    CourierSettings:
      type: object
      required: [name, books, tracks]
      properties:
        name: {type: string, nullable: true, example: Aramex, description: Null without a courier API.}
        books: {type: boolean, description: Parcels can be booked through the API.}
        tracks: {type: boolean, description: Tracking is read from the API every 30 minutes.}

    ShipmentBookingInput:
      type: object
      properties:
        shipping_cost_halalas: {type: integer, minimum: 0, nullable: true}

    ShipmentCancelInput:
      type: object
      properties:
        reason: {type: string, maxLength: 1000, nullable: true}

    ReturnStatus:
      type: string
      enum: [requested, approved, rejected, completed]

    ReturnReason:
      type: string
      enum: [defective, damaged_in_transit, wrong_item, not_as_described, changed_mind, other]

    OrderReturn:
      type: object
      required: [id, customer_order_id, order_number, customer, status, reason, note, recorded_by, recorded_at, decided_by, decided_at, decision_note, refund, refundable, open]
      properties:
        id: {type: string, format: uuid}
        customer_order_id: {type: string, format: uuid}
        order_number: {type: string}
        customer:
          type: object
          required: [name, phone]
          properties:
            name: {type: string, nullable: true}
            phone: {$ref: '#/components/schemas/SaudiMobile'}
        status: {$ref: '#/components/schemas/ReturnStatus'}
        reason: {$ref: '#/components/schemas/ReturnReason'}
        note: {type: string, nullable: true}
        recorded_by: {$ref: '#/components/schemas/Actor'}
        recorded_at: {type: string, format: date-time}
        decided_by:
          type: object
          allOf: [{$ref: '#/components/schemas/Actor'}]
          nullable: true
        decided_at: {type: string, format: date-time, nullable: true}
        decision_note: {type: string, nullable: true}
        refund:
          type: object
          allOf: [{$ref: '#/components/schemas/Refund'}]
          nullable: true
          description: The refund asked for when the return was approved.
        refundable: {$ref: '#/components/schemas/Money'}
        open: {type: boolean, description: 'Can be approved or rejected now: never decided, or its refund was rejected or failed.'}

    ReturnInput:
      type: object
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/ReturnReason'}
        note: {type: string, maxLength: 2000, nullable: true}

    ReturnApprovalInput:
      type: object
      required: [amount_halalas]
      properties:
        amount_halalas: {type: integer, minimum: 1, description: 'What goes back to the card; at most what is still refundable.'}
        note: {type: string, maxLength: 1000, nullable: true}

    ReturnRejectionInput:
      type: object
      required: [note]
      properties:
        note: {type: string, minLength: 3, maxLength: 1000}

    ShipmentInput:
      type: object
      required: [courier, tracking_number]
      properties:
        courier: {type: string, maxLength: 100}
        tracking_number: {type: string, maxLength: 100}
        tracking_url: {type: string, format: uri, nullable: true}
        shipping_cost_halalas: {type: integer, minimum: 0, nullable: true}

    ShipmentEventInput:
      type: object
      required: [status, occurred_at]
      properties:
        status:
          type: string
          enum: [picked_up, in_transit, out_for_delivery, failed_attempt, delivered, returned]
          description: '`returned`: the courier brought the parcel back. A shipment not yet collected is called off instead.'
        description: {type: string, maxLength: 500, nullable: true}
        location: {type: string, maxLength: 200, nullable: true}
        occurred_at: {type: string, format: date-time}

    PurchaseOrderStatus:
      type: string
      enum: [draft, placed, supplier_confirmed, paid, shipped, received, cancelled]

    PurchaseOrderInput:
      type: object
      minProperties: 1
      properties:
        alibaba_order_ref: {type: string, maxLength: 100, nullable: true}
        total_minor: {type: integer, minimum: 0}
        currency: {type: string, enum: [USD, CNY, SAR]}
        fx_rate_to_sar: {type: string, pattern: '^[0-9]{1,10}(\.[0-9]{1,8})?$'}
        freight_forwarder: {type: string, maxLength: 100, nullable: true}
        freight_tracking_ref: {type: string, maxLength: 100, nullable: true}
        eta: {type: string, format: date, nullable: true}
        paid_at:
          type: string
          format: date-time
          description: Once the order is paid, records or corrects the payment date.

    PurchaseOrder:
      type: object
      required: [id, po_number, campaign, supplier, supplier_quotation_id, alibaba_order_ref, total, fx_rate_to_sar, total_sar, status, lines, placed_at, supplier_confirmed_at, paid_at, shipped_at, freight_forwarder, freight_tracking_ref, eta, receipts, documents]
      properties:
        id: {type: string, format: uuid}
        po_number: {type: string, example: PO-2611-0007}
        campaign:
          type: object
          required: [id, code]
          properties:
            id: {type: string, format: uuid}
            code: {type: string}
        supplier:
          type: object
          required: [id, name]
          properties:
            id: {type: string, format: uuid}
            name: {type: string}
        supplier_quotation_id: {type: string, format: uuid}
        alibaba_order_ref: {type: string, nullable: true}
        total:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: In the supplier's currency. Starts as the captured units at the unit cost the supplier reconfirmed.
        fx_rate_to_sar:
          type: string
          nullable: true
          description: Exact decimal. The quote's rate when the order is in the quote's currency, 1 for SAR; otherwise null until recorded.
        total_sar:
          type: object
          allOf: [{$ref: '#/components/schemas/Money'}]
          nullable: true
          description: The total at the recorded rate, rounded to the halala; null while the rate is unknown.
        status: {$ref: '#/components/schemas/PurchaseOrderStatus'}
        lines:
          type: array
          items:
            type: object
            required: [product_variant, qty, unit_cost]
            properties:
              product_variant: {$ref: '#/components/schemas/AdminVariant'}
              qty: {type: integer, description: Captured units for this variant.}
              unit_cost: {$ref: '#/components/schemas/Money'}
        placed_at: {type: string, format: date-time, nullable: true}
        supplier_confirmed_at: {type: string, format: date-time, nullable: true}
        paid_at: {type: string, format: date-time, nullable: true}
        shipped_at: {type: string, format: date-time, nullable: true}
        freight_forwarder: {type: string, nullable: true}
        freight_tracking_ref: {type: string, nullable: true}
        eta: {type: string, format: date, nullable: true}
        receipts:
          type: array
          description: Warehouse receipts (fulfilment, E13); empty until then.
          items: {$ref: '#/components/schemas/InboundReceipt'}
        documents:
          type: array
          description: Papers kept with the order, oldest first.
          items: {$ref: '#/components/schemas/PurchaseOrderDocument'}

    PurchaseOrderDocumentKind:
      type: string
      enum: [alibaba_invoice, payment_receipt, shipping_document, customs_document, other]

    PurchaseOrderDocument:
      type: object
      required: [id, kind, file_name, size_bytes, url, uploaded_by, uploaded_at, removable]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/PurchaseOrderDocumentKind'}
        file_name: {type: string, description: The name the file had when it was uploaded.}
        size_bytes: {type: integer}
        url: {type: string, format: uri, description: Signed link that works for 30 minutes.}
        uploaded_by: {$ref: '#/components/schemas/Actor'}
        uploaded_at: {type: string, format: date-time}
        removable: {type: boolean, description: 'True within 24 hours of the upload; after that the paper is kept as a record.'}

    InboundReceiptInput:
      type: object
      required: [warehouse_name, received_at, lines]
      properties:
        warehouse_name: {type: string, maxLength: 100}
        received_at: {type: string, format: date-time}
        notes: {type: string, maxLength: 5000, nullable: true}
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_variant_id, qty_received, qty_damaged]
            properties:
              product_variant_id: {type: string, format: uuid}
              qty_received: {type: integer, minimum: 0}
              qty_damaged: {type: integer, minimum: 0}

    InboundReceipt:
      type: object
      required: [id, warehouse_name, received_at, received_by, notes, lines, photo_urls]
      properties:
        id: {type: string, format: uuid}
        warehouse_name: {type: string}
        received_at: {type: string, format: date-time}
        received_by: {$ref: '#/components/schemas/Actor'}
        notes: {type: string, nullable: true}
        lines:
          type: array
          items:
            type: object
            required: [product_variant_id, qty_expected, qty_received, qty_damaged, qty_missing]
            properties:
              product_variant_id: {type: string, format: uuid}
              qty_expected: {type: integer}
              qty_received: {type: integer}
              qty_damaged: {type: integer}
              qty_missing: {type: integer, description: Expected but not received.}
        photo_urls:
          type: array
          description: Photos of the goods as they arrived, oldest first; signed links that work for 30 minutes.
          items: {type: string, format: uri}

    ReconciliationRun:
      type: object
      required: [id, run_date, provider, status, payments_checked, mismatch_count, started_at, finished_at]
      properties:
        id: {type: string, format: uuid}
        run_date: {type: string, format: date}
        provider: {type: string, enum: [moyasar]}
        status: {type: string, enum: [running, matched, mismatches, failed]}
        payments_checked: {type: integer}
        mismatch_count: {type: integer}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}

    ReconciliationItem:
      type: object
      required: [id, run_id, payment_id, mismatch_type, our_value, provider_value, resolved_by, resolved_at, resolution_note]
      properties:
        id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        payment_id: {type: string, format: uuid, nullable: true}
        mismatch_type: {type: string, enum: [status, amount, missing_locally, missing_at_provider, orphan_hold, stuck_void]}
        our_value: {type: object, nullable: true, additionalProperties: true}
        provider_value: {type: object, nullable: true, additionalProperties: true}
        resolved_by:
          type: object
          allOf: [{$ref: '#/components/schemas/Actor'}]
          nullable: true
        resolved_at: {type: string, format: date-time, nullable: true}
        resolution_note: {type: string, nullable: true}

    LedgerAccountCode:
      type: string
      enum: [moyasar_clearing, bank, inventory_in_transit, customer_prepayments, vat_output_payable, supplier_payable, sales_revenue, payment_fees, vat_input_recoverable]

    LedgerTransactionType:
      type: string
      enum: [capture, refund, revenue_recognition, adjustment, reversal, settlement]

    LedgerAccountBalance:
      type: object
      required: [code, name, type, debits, credits, balance]
      properties:
        code: {$ref: '#/components/schemas/LedgerAccountCode'}
        name: {type: string, example: Moyasar clearing}
        type: {type: string, enum: [asset, liability, revenue, expense, equity]}
        debits: {$ref: '#/components/schemas/Money'}
        credits: {$ref: '#/components/schemas/Money'}
        balance: {allOf: [{$ref: '#/components/schemas/Money'}], description: Debits minus credits; negative for a credit balance.}

    LedgerLine:
      type: object
      required: [account, account_name, direction, amount]
      properties:
        account: {$ref: '#/components/schemas/LedgerAccountCode'}
        account_name: {type: string}
        direction: {type: string, enum: [D, C]}
        amount: {$ref: '#/components/schemas/Money'}

    LedgerTransaction:
      type: object
      required: [id, type, reference, description, order, approval_request_id, reverses_transaction_id, entries, actor, occurred_at]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/LedgerTransactionType'}
        reference: {type: string, example: 'capture:9b1c…', description: 'Unique per type: what the posting is for.'}
        description: {type: string}
        order:
          type: object
          nullable: true
          required: [id, number]
          properties:
            id: {type: string, format: uuid}
            number: {type: string}
        approval_request_id: {type: string, format: uuid, nullable: true}
        reverses_transaction_id: {type: string, format: uuid, nullable: true}
        entries:
          type: array
          items: {$ref: '#/components/schemas/LedgerLine'}
        actor: {$ref: '#/components/schemas/Actor'}
        occurred_at: {type: string, format: date-time}

    LedgerAdjustmentInput:
      type: object
      required: [description]
      description: Either `lines` or `reverses_transaction_id`.
      properties:
        description: {type: string, minLength: 3, maxLength: 255}
        lines:
          type: array
          nullable: true
          minItems: 2
          maxItems: 20
          items:
            type: object
            required: [account, direction, amount_halalas]
            properties:
              account: {$ref: '#/components/schemas/LedgerAccountCode'}
              direction: {type: string, enum: [D, C]}
              amount_halalas: {type: integer, format: int64, minimum: 1}
        reverses_transaction_id: {type: string, format: uuid, nullable: true}

    LedgerAdjustment:
      type: object
      required: [id, description, lines, reverses, status, approval_request_id, ledger_transaction_id, requested_by, created_at]
      properties:
        id: {type: string, format: uuid}
        description: {type: string}
        lines:
          type: array
          nullable: true
          description: Null for a reversal.
          items: {$ref: '#/components/schemas/LedgerLine'}
        reverses:
          type: object
          nullable: true
          description: The posting it reverses; null for lines.
          required: [id, type, reference, description]
          properties:
            id: {type: string, format: uuid}
            type: {$ref: '#/components/schemas/LedgerTransactionType'}
            reference: {type: string}
            description: {type: string}
        status: {type: string, enum: [pending, posted, rejected]}
        approval_request_id: {type: string, format: uuid, nullable: true}
        ledger_transaction_id: {type: string, format: uuid, nullable: true, description: The posting once approved.}
        requested_by:
          type: object
          allOf: [{$ref: '#/components/schemas/Actor'}]
          nullable: true
        created_at: {type: string, format: date-time}

    MoyasarSettlement:
      type: object
      required: [id, provider_settlement_id, gross, fee, fee_vat, net, settled_at, line_count, unmatched_count, ledger_transaction_id, imported_at]
      properties:
        id: {type: string, format: uuid}
        provider_settlement_id: {type: string}
        gross: {allOf: [{$ref: '#/components/schemas/Money'}], description: Net plus fee.}
        fee: {allOf: [{$ref: '#/components/schemas/Money'}], description: "Moyasar's fee, VAT included."}
        fee_vat: {$ref: '#/components/schemas/Money'}
        net: {allOf: [{$ref: '#/components/schemas/Money'}], description: Paid into the bank.}
        settled_at: {type: string, format: date-time, nullable: true}
        line_count: {type: integer}
        unmatched_count: {type: integer, description: Lines for payments we do not know.}
        ledger_transaction_id: {type: string, format: uuid, nullable: true, description: Null only when every amount is zero.}
        imported_at: {type: string, format: date-time}

    MoyasarSettlementLine:
      type: object
      required: [type, provider_payment_id, payment_id, amount, fee, fee_vat, payment_amount, transacted_at]
      properties:
        type: {type: string, example: payment, description: "Moyasar's line type: payment, refund, void, fee, chargeback, …"}
        provider_payment_id: {type: string, nullable: true}
        payment_id: {type: string, format: uuid, nullable: true, description: Null when we have no such payment.}
        amount: {allOf: [{$ref: '#/components/schemas/Money'}], description: Net of the fee; negative for money going back.}
        fee: {$ref: '#/components/schemas/Money'}
        fee_vat: {$ref: '#/components/schemas/Money'}
        payment_amount: {type: object, nullable: true, allOf: [{$ref: '#/components/schemas/Money'}]}
        transacted_at: {type: string, format: date-time, nullable: true}

    AuditLogEntry:
      type: object
      required: [id, actor, action, subject_type, subject_id, before, after, ip, user_agent, request_id, occurred_at]
      properties:
        id: {type: integer, format: int64}
        actor: {$ref: '#/components/schemas/Actor'}
        action: {type: string, example: campaign.approve}
        subject_type: {type: string, nullable: true}
