        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/orders/{order_id}/return:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Admin orders]
      operationId: adminRecordReturn
      summary: Record a customer's return
      description: |
        The customer asked support to return a `delivered` order within its
        return window. The order becomes `return_requested` and is not
        completed when the window ends, until the return is decided. One
        return per order. 409 `return_window_ended`, `return_exists`, or
        `invalid_transition` if the order is not `delivered`.
      x-epic: E13
      x-status: live
      x-permission: refunds.request
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnInput'}
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OrderReturn'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`return_window_ended`, `return_exists` or `invalid_transition`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/returns/{return_id}/approve:
    parameters:
      - $ref: '#/components/parameters/ReturnId'
    post:
      tags: [Admin orders]
      operationId: adminApproveReturn
      summary: Accept a return and ask for its refund
      description: |
        Asks for a refund of `amount_halalas` (reason `customer_return`),
        which waits for a second admin with the finance role like any refund
        (see `adminRequestRefund` for its 422 codes). Once it goes through,
        the order is `returned` and the return `completed`, even if the
        delivery fee was kept. The customer is told the return was accepted.
        A return whose refund was rejected or failed can be approved again
        with another amount, or rejected.
      x-epic: E13
      x-status: live
      x-permission: refunds.request
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReturnApprovalInput'}
      responses:
        '200':
          description: Accepted; the refund waits for approval.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OrderReturn'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422':
          description: '`refund_exceeds_captured`, `payment_not_captured`, or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /admin/returns/{return_id}/reject:
    parameters:
      - $ref: '#/components/parameters/ReturnId'
    post:
      tags: [Admin orders]
      operationId: adminRejectReturn
      summary: Decline a return
      description: |
        The order is `delivered` again, and completed by the hourly sweep if
        its return window has ended. The customer is told; the note stays
        with staff.
      x-epic: E13
