  # ---------------------------------------------------------------- Admin campaigns
  /admin/campaigns:
    get:
      tags: [Admin campaigns]
      operationId: adminListCampaigns
      summary: Campaigns in every status
      x-epic: E7
      x-status: live
      x-permission: campaigns.view
      security: [{adminToken: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/CampaignStatus'}
        - name: needs_attention
          in: query
          description: Only campaigns waiting on an admin (approval, supplier decision, below-target decision).
          schema: {type: boolean}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of campaigns.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AdminCampaign'}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [Admin campaigns]
      operationId: adminCreateCampaign
      summary: Create a draft campaign
      description: |
        The quotation must belong to the product, not be rejected or expired,
        and its supplier must not be blocked. A quotation for one variant can
        only price a campaign for that variant. Errors are 422 with codes
        `quotation_not_for_product`, `quotation_not_usable`, `supplier_blocked`,
        `variant_not_in_product`, `variant_not_active` (an archived variant)
        or `quotation_not_for_variants`.
      x-epic: E7
      x-status: live
      x-permission: campaigns.edit
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdminCampaignInput'}
      responses:
        '201':
          description: Created as `draft`, without tiers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminCampaign'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/campaigns/{campaign_id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [Admin campaigns]
      operationId: adminGetCampaign
      summary: One campaign with tiers and closing progress
      x-epic: E7
      x-status: live
      x-permission: campaigns.view
      security: [{adminToken: []}]
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminCampaign'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Admin campaigns]
      operationId: adminUpdateCampaign
      summary: Edit a draft
      description: |
        Only in `draft`, otherwise 409 `invalid_transition`. Send the
        `lock_version` you read; a stale one returns 409 `stale_campaign`.
        The body replaces the editable fields: an omitted optional field goes
        back to its default. The same 422 checks as create apply.
      x-epic: E7
      x-status: live
      x-permission: campaigns.edit
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AdminCampaignInput'
                - type: object
                  required: [lock_version]
                  properties:
                    lock_version: {type: integer}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminCampaign'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/campaigns/{campaign_id}/tiers:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    put:
      tags: [Admin campaigns]
      operationId: adminReplaceCampaignTiers
      summary: Save a new tier set
      description: |
        Only in `draft`. Send the campaign's `lock_version`; a stale one
        returns 409 `stale_campaign`. Each save stores a new full version; old
        versions are kept. Tiers must cover 1 to `max_qty` with no gaps or
        overlaps, and the price must never rise with quantity. `reason` is
        required from version 2.
      x-epic: E8
      x-status: live
      x-permission: pricing.edit
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TierSetInput'}
      responses:
        '200':
          description: Saved; the campaign now shows the new version.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/AdminCampaign'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422':
          description: '`tiers_gap`, `tiers_overlap`, `tiers_do_not_reach_max`, `tiers_exceed_max`, `price_rises_with_quantity`, a missing `reason` from version 2, or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /admin/campaigns/{campaign_id}/margin:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [Admin campaigns]
      operationId: adminGetCampaignMargin
      summary: Margin per tier against the 15% floor
      description: |
        What the approval screen shows. Approval is blocked when any tier
        fails, unless an admin with `campaigns.override_margin` approves with a
        reason. Before approval the landed cost comes from the quotation; from
        approval on it is the snapshot taken then.
      x-epic: E8
      x-status: live
      x-permission: campaigns.view
      security: [{adminToken: []}]
      responses:
        '200':
          description: The margin check.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/MarginReport'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`tiers_missing` or `landed_cost_missing`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /admin/campaigns/{campaign_id}/submit:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminSubmitCampaign
      summary: Send a draft for approval
      x-epic: E7
      x-status: live
      x-permission: campaigns.edit
      security: [{adminToken: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422':
          description: '`tiers_missing`, a tier error (`tiers_gap`, `tiers_overlap`, `tiers_do_not_reach_max`, `tiers_exceed_max`, `price_rises_with_quantity`), `landed_cost_missing`, `supplier_not_approved`, `quotation_not_usable`, `product_not_active` or `variant_not_active`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /admin/campaigns/{campaign_id}/approve:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminApproveCampaign
      summary: Approve and lock the terms
      description: |
        Needs `campaigns.approve`. Re-runs the submit checks, then locks tiers,
        target and maximum, snapshots the landed cost, sets
        `deadline_at = starts_at + 7 days` (moving `starts_at` to now if it has
        passed), and schedules the campaign. A failing margin check returns 422
        `margin_below_floor` unless `override_reason` is sent, which needs
        `campaigns.override_margin` (403 without it). When every tier passes,
        `override_reason` is ignored.
      x-epic: E7
      x-status: live
      x-permission: campaigns.approve
      x-field-permissions: {override_reason: campaigns.override_margin}
      security: [{adminToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                override_reason:
                  type: string
                  minLength: 3
                  maxLength: 1000
                  nullable: true
                  description: Only for approving below the margin floor; needs `campaigns.override_margin`. Audited.
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422':
          description: '`margin_below_floor` (body includes `margin`), one of the submit checks, or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarginBlockedError'}

  /admin/campaigns/{campaign_id}/reject:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminRejectCampaign
      summary: Send back to draft
      x-epic: E7
      x-status: live
      x-permission: campaigns.approve
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/campaigns/{campaign_id}/extension-window:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [Admin campaigns]
      operationId: adminGetExtensionWindow
      summary: Whether the deadline can be extended, and how far
      x-epic: E7
      x-status: live
      x-permission: campaigns.view
      security: [{adminToken: []}]
      responses:
        '200':
          description: The extension window.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ExtensionWindow'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /admin/campaigns/{campaign_id}/extend:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminExtendCampaign
      summary: Use the one deadline extension
      description: |
        Allowed once, while `active`, before the deal is confirmed, and only to
        a date at least 3 days before the earliest hold expires (holds still
        waiting for authorization count). A blocked request returns 422
        `extension_not_allowed` with the current `window` in the body.
      x-epic: E7
      x-status: live
      x-permission: campaigns.extend
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_deadline_at, reason]
              properties:
                new_deadline_at: {type: string, format: date-time}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: '`extension_not_allowed` (body includes `window`), or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExtensionBlockedError'}

  /admin/campaigns/{campaign_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminCancelCampaign
      summary: Cancel a campaign
      description: |
        From `draft`, `pending_approval`, `scheduled`, `active`, and
        `closing` at `settling_joins` or `awaiting_supplier`, it cancels at
        once (200): every join is released and every hold voided. Once
        captures have started (`closing` at `capturing` or `needs_admin`, or
        `purchasing`), money may have to go back, so it opens a
        `campaign_cancellation` approval request for a second admin with the
        finance role instead (202) and changes nothing else; asking again
        returns the request already waiting, or the approved one not yet
        carried out. Approving it refunds captured joins and cancels the
        orders (`POST /admin/approval-requests/{id}/approve`). `fulfilling`
        and ended campaigns answer 409 `invalid_transition`.
      x-epic: E7
      x-status: live
      x-permission: campaigns.cancel
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '202':
          description: Waiting for financial approval.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ApprovalRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/campaigns/{campaign_id}/supplier-decision:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminRecordSupplierDecision
      summary: Record the supplier's reconfirmation before capture
      description: |
        Only while `closing_step` is `awaiting_supplier` and before
        `supplier_decision_due_at` (409 `supplier_decision_overdue` after it;
        the closing sweep then fails the campaign). `confirmed` records the
        unit cost (in `currency`, the quotation's currency when left out),
        stock and quotation reference in a `supplier_confirmed` event, moves
        `closing_step` to `capturing` and starts captures. `available_qty`
        below `final_qty` is 422 `supplier_stock_short`: a supplier that
        cannot supply every unit is recorded as `rejected`. `rejected` fails
        the campaign (`end_reason` `supplier_rejected`) and voids every hold.
        Captures run in the background, so the campaign returned may already
        have moved on.
      x-epic: E10
      x-status: live
      x-permission: campaigns.close
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupplierDecisionInput'}
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`invalid_transition` (not awaiting the supplier) or `supplier_decision_overdue`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: '`supplier_stock_short`, or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /admin/campaigns/{campaign_id}/below-target-decision:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminDecideBelowTarget
      summary: Proceed or cancel when captures fell short
      description: |
        Only while `closing_step` is `needs_admin` (captured units below the
        target or the supplier's MOQ). `proceed` buys the captured units: the
        campaign moves to `purchasing`. `cancel` opens a
        `campaign_cancellation` approval request for a second admin with the
