openapi: 3.0.3
info:
  title: Group buying API
  version: 0.1.0
  description: |
    The one API behind the customer website, the admin portal and the mobile app.
    Product rules come from the MVP build spec; this file is the contract the
    clients build against. Every operation carries:

    - `x-epic`: the backlog epic that ships it.
    - `x-status`: `live` when the Laravel API serves it, `mock` while only the
      mock server does. A contract test keeps this honest in both directions.
    - `x-permission` (admin operations): the permission the admin needs, from
      `AdminUser.permissions`. Without it the API answers 403 `forbidden`. The
      admin portal hides actions the signed-in admin lacks.
      `x-field-permissions` names an extra permission needed to send a
      particular field, on top of `x-permission`.

    ## Conventions

    - **Language.** Send `Accept-Language: ar` or `en`; Arabic is the default.
      Customer endpoints return text (`title`, `name`, `description`) in that
      language. Admin endpoints return both, as `*_ar` and `*_en`.
    - **Money.** Responses use the `Money` object: integer minor units
      (halalas for SAR), currency, and a display string. Requests send integers
      in fields ending `_halalas` (SAR) or `_minor` (supplier currency). Prices
      include 15% VAT. Floats never carry money.
    - **IDs.** Every resource is addressed by a UUID `id`. Campaigns and orders
      also have a short human reference (`code`, `order_number`).
    - **Time.** ISO 8601 in UTC (`2026-11-08T07:00:00Z`). Clients show Riyadh time.
    - **Envelope.** A single resource is `{"data": {...}}`. A list is
      `{"data": [...], "meta": {"next_cursor": ..., "per_page": ...}}`; pass
      `cursor` to get the next page. `/health` is unwrapped.
    - **Errors.** `{"message": "...", "code": "..."}`, plus `errors` (field to
      messages) on 422. `message` is localized; branch on `code`. Every endpoint
      may return `unauthenticated` (401), `forbidden` (403), `not_found` (404),
      `validation_failed` (422) and `too_many_requests` (429, with `Retry-After`);
      endpoint-specific codes are listed with each response.
    - **Tracing.** Every response has `X-Request-Id`. Send your own (8-64 of
      `A-Z a-z 0-9 . _ -`) to correlate client and server logs.

    ## Live progress

    Campaign progress is also pushed over Laravel Reverb (Pusher protocol) on the
    public channel `campaigns.{campaign_id}`, event `progress.updated`, with a
    `CampaignProgress` payload (as in any Pusher event, the event's `data` is
    that object as a JSON string). Connect to `wss://{reverb host}/app/{app key}`
    with any Pusher client; the channel needs no sign-in. Only campaigns
    customers can see are pushed.

    Pushes are best effort and may skip numbers in between. Read
    `GET /campaigns/{campaign_id}/progress` (the same shape) after connecting
    and after every reconnect, keep a slow poll while connected, and keep
    the payload with the higher `version` when a push and a read cross.
    Clients cannot send events on these channels.

    ## Joining and paying

    1. `POST /campaigns/{campaign_id}/participations` reserves units for 15
       minutes and returns a payment with `checkout` settings.
    2. The client opens the Moyasar form with those settings (authorize only).
    3. When Moyasar redirects back, the client calls
       `POST /payments/{payment_id}/sync` with Moyasar's payment ID. The API
       fetches the payment from Moyasar itself; redirect parameters are never
       trusted. A Moyasar webhook does the same on the server side.
    4. If the card was declined, `POST /me/participations/{participation_id}/payments`
       starts a new attempt while the reservation lasts.
servers:
  - url: /api/v1
    description: Same origin as the client
  - url: http://localhost:8000/api/v1
    description: Local Laravel
  - url: http://localhost:4010
    description: Local mock server (Prism)

tags:
  - name: Health
    description: Readiness for load balancers and uptime checks.
  - name: Auth
    description: Customer sign-in with phone number and SMS code.
  - name: Account
    description: The customer's profile, privacy consent, addresses and devices.
  - name: Catalog
    description: Categories for browsing.
  - name: Campaigns
    description: What customers can see and join.
  - name: Participations
    description: A customer's joins, each with one card hold.
  - name: Payments
    description: Card holds through Moyasar.
  - name: Orders
    description: Created when a hold is captured. Tracking and invoices live here.
  - name: Webhooks
    description: Called by providers, never by clients.
  - name: Admin auth
    description: Admin sign-in with password plus SMS code.
  - name: Admin users
    description: Admin accounts and their roles.
  - name: Admin catalog
    description: Products, variants, photos and categories.
  - name: Admin suppliers
    description: Suppliers and their quotations with landed cost.
  - name: Admin campaigns
    description: Create, price, approve, extend, cancel and close campaigns.
  - name: Admin payments
    description: Holds, charges and every call made to Moyasar.
  - name: Admin refunds and approvals
    description: Refunds and the second-admin approvals they need.
  - name: Admin orders
    description: Customer orders as operations sees them.
  - name: Admin purchasing
    description: The one bulk Alibaba order per successful campaign.
  - name: Admin fulfilment
    description: Warehouse receipts and last-mile shipments.
  - name: Admin finance
    description: Reconciliation with Moyasar and the audit log.

paths:
  # ---------------------------------------------------------------- Health
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Readiness check
      description: 200 when PostgreSQL and Redis both respond, 503 otherwise.
      x-epic: E2
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Every dependency answered.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: At least one dependency failed.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            Content-Language: {$ref: '#/components/headers/ContentLanguage'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example:
                status: degraded
                message: بعض الأنظمة لا تستجيب.
                checks: {database: ok, redis: failing}
                time: '2026-11-02T09:00:00Z'

  # ---------------------------------------------------------------- Customer auth
  /auth/otp:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Send a sign-in code by SMS
      description: |
        Starts sign-in or sign-up. Sends a 6-digit code that expires after
        5 minutes. One code per number per minute, 5 per number per hour and
        20 per IP per hour; a 429 says when to retry. An earlier code stays
        valid until it expires, so a slow SMS still works after a resend.
      x-epic: E5
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: {$ref: '#/components/schemas/SaudiMobile'}
      responses:
        '202':
          description: Code sent.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/OtpChallenge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: '`sms_unavailable`: the code could not be sent. Try again in a few minutes.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Exchange the SMS code for an access token
      description: |
        Creates the account on first sign-in. Send the token as
        `Authorization: Bearer <token>`. After 5 wrong codes the challenge is
        spent and a new code is needed.
      x-epic: E5
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, code, device_name]
              properties:
                challenge_id: {type: string, format: uuid}
                code: {type: string, pattern: '^[0-9]{6}$', example: '482913'}
                device_name:
                  type: string
                  maxLength: 100
                  description: Shown in the account's session list.
                  example: Safari on iPhone
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/CustomerSession'}
        '422':
          description: |
            Wrong or expired code (`code`: `otp_invalid`, `otp_expired`,
            `otp_attempts_exhausted`), a suspended account (`account_blocked`),
            or invalid input.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current token
      description: Other devices stay signed in. Tokens otherwise last 90 days.
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      responses:
        '204': {description: Signed out.}
        '401': {$ref: '#/components/responses/Unauthenticated'}

  # ---------------------------------------------------------------- Account
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: The signed-in customer
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update name, email or language
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: {type: string, maxLength: 100, nullable: true}
                email: {type: string, format: email, maxLength: 191, nullable: true}
                locale: {$ref: '#/components/schemas/Locale'}
      responses:
        '200':
          description: Updated customer.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /me/privacy-consent:
    post:
      tags: [Account]
      operationId: acceptPrivacyPolicy
      summary: Record consent to the privacy policy (PDPL)
      description: |
        Required before the first join. Stores the policy version and the time.
        Call again when `User.privacy_consent.policy_version` is older than
        `current_privacy_policy_version`. Accepting the same version twice is
        harmless.
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_version]
              properties:
                policy_version: {type: string, maxLength: 20, example: '2026-11'}
      responses:
        '200':
          description: Consent recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422':
          description: '`privacy_policy_outdated` when `policy_version` is not the current version, or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /me/addresses:
    get:
      tags: [Account]
      operationId: listAddresses
      summary: Saved delivery addresses
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      responses:
        '200':
          description: Addresses, default first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
    post:
      tags: [Account]
      operationId: createAddress
      summary: Add a delivery address
      description: The first address becomes the default. Sending `is_default` true makes the new address the default instead of the old one. Up to 20 addresses.
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422':
          description: '`address_limit_reached`, or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /me/addresses/{address_id}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    patch:
      tags: [Account]
      operationId: updateAddress
      summary: Change a delivery address
      description: |
        Send the whole address: optional fields left out are cleared.
        `is_default: true` makes this the default address. The default only
        moves to another address, so `false` (or leaving it out) never unsets
        it. Orders keep a copy of the address they were shipped to, so editing
        never changes past orders.
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddressInput'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Address'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    delete:
      tags: [Account]
      operationId: deleteAddress
      summary: Remove a delivery address
      description: If it was the default, the most recently added remaining address becomes the default.
      x-epic: E5
      x-status: live
      security: [{customerToken: []}]
      responses:
        '204': {description: Removed.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/device-tokens:
    post:
      tags: [Account]
      operationId: registerDeviceToken
      summary: Register a push token
      description: |
        Mobile app only. Send the Expo push token (`ExponentPushToken[...]`,
        from expo-notifications getExpoPushTokenAsync): the API sends through
        Expo's push service, and other kinds of token get no messages. Call it
        after sign-in and whenever the token changes. Registering the same token again just refreshes it; a
        token registered from another account moves to that account. Signing
        out (`POST /auth/logout`) removes it, so the device stops getting the
        account's messages. The customer's 10 most recently seen devices are
        kept. Push messages carry `notification_id` and `template` in their data.
      x-epic: E14
      x-status: live
      security: [{customerToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, token]
              properties:
                platform: {type: string, enum: [ios, android, web]}
                token: {type: string, maxLength: 4096}
      responses:
        '204': {description: Registered.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ---------------------------------------------------------------- Catalog and campaigns
  /categories:
    get:
      tags: [Catalog]
      operationId: listCategories
      summary: Browsing categories
      x-epic: E6
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: All categories, sorted for display.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Category'}

  /campaigns:
    get:
      tags: [Campaigns]
      operationId: listCampaigns
      summary: Campaigns customers can see
      description: |
        `open` (the default) lists `active` campaigns, soonest deadline first.
        `upcoming` lists `scheduled` ones. `ended` lists everything after
        `active`, most recent first. Drafts and campaigns awaiting approval
        are never listed.
      x-epic: E7
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: filter
          in: query
          schema: {type: string, enum: [open, upcoming, ended], default: open}
        - name: category
          in: query
          description: Category slug.
          schema: {type: string}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of campaigns.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/CampaignSummary'}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /campaigns/{campaign_id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [Campaigns]
      operationId: getCampaign
      summary: Campaign page
      x-epic: E7
      x-status: live
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/CampaignDetail'}
        '404': {$ref: '#/components/responses/NotFound'}

  /campaigns/{campaign_id}/progress:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    get:
      tags: [Campaigns]
      operationId: getCampaignProgress
      summary: Live progress for polling
      description: Same payload as the Reverb `progress.updated` event. Cached for at most 2 seconds.
      x-epic: E7
      x-status: live
      responses:
        '200':
          description: Current progress.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/CampaignProgress'}
        '404': {$ref: '#/components/responses/NotFound'}

  /campaigns/{campaign_id}/participations:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Participations]
      operationId: joinCampaign
      summary: Join a campaign
      description: |
        Reserves the units for 15 minutes and fixes the hold price, then
        returns a payment whose `checkout` opens the Moyasar form.

        The server computes every amount. `shown_unit_price_halalas` is only
        compared with the current price: if they differ the API answers 409
        `price_changed` with the new price, and the customer confirms again.

        Retrying with the same `client_request_id` returns the original
        participation, again with 201, instead of joining twice.
      x-epic: E7
      x-status: live
      security: [{customerToken: []}]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JoinRequest'}
      responses:
        '201':
          description: Units reserved (or the earlier join with this `client_request_id`); open the payment form.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Participation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: '`privacy_consent_required`: accept the privacy policy first.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: |
            `price_changed` (body has `current_unit_price`), `sold_out` (not
            enough units left; body has `remaining_qty`), or
            `campaign_not_joinable` (not active, or the deadline passed).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JoinConflict'}
        '422':
          description: |
            `per_customer_limit_exceeded`, `variant_not_in_campaign` (not in
            this campaign, or archived), `address_not_found`, a `client_request_id` already used for another
            campaign, or invalid input.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- Participations and payments
  /me/participations:
    get:
      tags: [Participations]
      operationId: listMyParticipations
      summary: My joins
      description: Newest first. Includes joins whose payment failed, so the customer can see what happened.
      x-epic: E11
      x-status: live
      security: [{customerToken: []}]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/ParticipationStatus'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of joins.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Participation'}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /me/participations/{participation_id}:
    parameters:
      - $ref: '#/components/parameters/ParticipationId'
    get:
      tags: [Participations]
      operationId: getMyParticipation
      summary: One join
      x-epic: E11
      x-status: live
      security: [{customerToken: []}]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The join.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Participation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}

  /me/participations/{participation_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ParticipationId'
    post:
      tags: [Participations]
      operationId: cancelMyParticipation
      summary: Cancel a join before close
      description: |
        Allowed while `can_cancel` is true: the campaign is `active`, its
        deadline has not passed and the deal is not yet confirmed (proposed
        rule, open question Q16). The hold is released and the units go back
        on sale.
      x-epic: E11
      x-status: live
      security: [{customerToken: []}]
      responses:
        '200':
          description: Cancelled; the hold is being released.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Participation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`cancellation_not_allowed`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /me/participations/{participation_id}/payments:
    parameters:
      - $ref: '#/components/parameters/ParticipationId'
    post:
      tags: [Payments]
      operationId: retryParticipationPayment
      summary: Try another card after a decline
      description: |
        Starts a new payment attempt for the same reserved units and hold
        amount. Allowed while the participation is `pending_payment`, its
        reservation has not expired, and the last attempt failed or its hold
        was refused (`rejection_reason` set; that hold is voided). The
        reservation keeps its original expiry.
      x-epic: E9
      x-status: live
      security: [{customerToken: []}]
      responses:
        '201':
          description: New attempt; open the payment form with its `checkout`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Payment'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`already_paid` when the participation is already `authorized` or `captured`; `reservation_expired` when it is otherwise no longer `pending_payment` or its reservation ran out; or `payment_in_progress` when the previous attempt has neither failed nor been refused.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  /payments/{payment_id}/sync:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      tags: [Payments]
      operationId: syncPayment
      summary: Check a payment with Moyasar after the form
      description: |
        Call as soon as Moyasar's form reports the payment it created (before
        any 3-D Secure step: the payment is then still `initiated`, and the
        participation stays `pending_payment` while its Moyasar ID is kept, so
        the hold is found even if the customer never comes back), and again
        when Moyasar redirects back, with the Moyasar payment ID from the
        redirect. The API fetches the payment from Moyasar and accepts the hold
        only if it is `authorized` for exactly the hold amount in SAR, by an
        allowed method, while the reservation is valid. Anything else is voided
        and `rejection_reason` says why. Safe to call more than once.

        A hold that arrives after the join can no longer count it (the
        reservation expired or the campaign moved past settling its joins)
        is voided too. If the form was submitted twice and both holds went
        through, the second is recorded with `duplicate_hold` and voided; it
        never replaces the participation's `payment`.
      x-epic: E9
      x-status: live
      security: [{customerToken: []}]
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_payment_id]
              properties:
                provider_payment_id:
                  type: string
                  maxLength: 64
                  description: The `id` query parameter Moyasar adds to the callback URL.
      responses:
        '200':
          description: |
            The participation after the check. `status` is `authorized` on
            success, `pending_payment` while Moyasar is still processing or
            after a decline (see `payment.status`), or `payment_failed`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Participation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          description: '`provider_payment_mismatch`: Moyasar has no such payment, or it does not belong to this payment.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503':
          description: '`payment_provider_unavailable`: Moyasar could not be reached. Try again shortly; the webhook will also settle it.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

