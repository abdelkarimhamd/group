        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`tiers_missing` or `landed_cost_missing`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /admin/campaigns/{campaign_id}/submit:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminSubmitCampaign
      summary: Send a draft for approval
      x-epic: E7
      x-status: mock
      security: [{adminToken: []}]
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422':
          description: '`tiers_missing`, `landed_cost_missing` or `supplier_not_approved`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /admin/campaigns/{campaign_id}/approve:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
    post:
      tags: [Admin campaigns]
      operationId: adminApproveCampaign
      summary: Approve and lock the terms
      description: |
        Needs `campaigns.approve`. Locks tiers, target and maximum, sets
        `deadline_at = starts_at + 7 days` (moving `starts_at` to now if it has
        passed), and schedules the campaign. A failing margin check returns 422
        `margin_below_floor` unless `override_reason` is sent by a `super_admin`.
      x-epic: E7
      x-status: mock
      security: [{adminToken: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                override_reason:
                  type: string
                  maxLength: 1000
                  nullable: true
                  description: Only for a `super_admin` approving below the margin floor. Audited.
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422':
          description: '`margin_below_floor` (body includes `margin`), or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarginBlockedError'}

