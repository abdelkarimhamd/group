      x-epic: E10
      x-status: live
      x-permission: campaigns.close
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: {type: string, enum: [proceed, cancel]}
                reason: {type: string, minLength: 3, maxLength: 1000}
      responses:
        '200': {$ref: '#/components/responses/AdminCampaignResult'}
        '202':
          description: Cancel chosen; waiting for financial approval of the refunds.
          content:
            application/json:
              schema:
