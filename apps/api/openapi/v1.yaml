    get:
      tags: [Admin purchasing]
      operationId: adminGetPurchaseOrder
      summary: One purchase order with receipts
      x-epic: E12
      x-status: live
      x-permission: purchasing.view
      security: [{adminToken: []}]
      responses:
        '200':
          description: The purchase order.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PurchaseOrder'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Admin purchasing]
      operationId: adminUpdatePurchaseOrder
      summary: Record Alibaba order details and freight
      description: |
        Fields sent change; the rest keep their value. Changing the currency
        needs `total_minor` in the new currency and clears a rate that no
        longer applies (a SAR order's rate is 1, `sar_rate_must_be_one`);
        `total_sar` follows the total and the rate. Line costs stay in the
        currency the supplier confirmed. Past `draft` the Alibaba order number
        and the rate cannot be cleared, nor the freight tracking reference once
        shipped (`purchase_order_incomplete`). `paid_at` can be set once the
        order is paid (`purchase_order_not_paid`), and step dates never go
        backwards (`step_date_out_of_order`). A received or cancelled order
        cannot change (409).
      x-epic: E12
      x-status: live
      x-permission: purchasing.edit
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseOrderInput'}
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PurchaseOrder'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/purchase-orders/{purchase_order_id}/status:
    parameters:
      - $ref: '#/components/parameters/PurchaseOrderId'
    post:
      tags: [Admin purchasing]
      operationId: adminAdvancePurchaseOrder
      summary: Move a purchase order forward
      description: |
        `placed`, `supplier_confirmed`, `paid`, then `shipped`, which needs a
        freight tracking reference and moves the campaign to `fulfilling`.
        `received` is set by recording an inbound receipt. Steps may be
        skipped but never undone, and only while the campaign is purchasing
        (409 otherwise). Past `draft` the order needs its Alibaba order number
        and a SAR value (`purchase_order_incomplete`, 422). Leaving `draft`
        moves the campaign's confirmed customer orders to `processing`.
        `occurred_at` (default now, never in the future) sets the step's time;
        it is never earlier than a step already recorded (`step_date_out_of_order`, 422).
      x-epic: E12
      x-status: live
      x-permission: purchasing.edit
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [placed, supplier_confirmed, paid, shipped]}
                occurred_at: {type: string, format: date-time, nullable: true}
                note: {type: string, maxLength: 1000, nullable: true}
      responses:
        '200':
          description: Moved.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/PurchaseOrder'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

