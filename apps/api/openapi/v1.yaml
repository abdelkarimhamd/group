  /admin/payments/{payment_id}/void:
    parameters:
      - $ref: '#/components/parameters/PaymentId'
    post:
      tags: [Admin payments]
      operationId: adminRequestManualVoid
      summary: Ask to release a hold Moyasar still keeps
      description: |
        For a hold that no longer counts here but that Moyasar still keeps
        (reconciliation's `orphan_hold` and `stuck_void`): the payment is
        `failed`, `capture_failed` or `expired`, `voided` with an open
        `stuck_void` mismatch, or `authorized` with a rejection reason; no
        capture is under way, and no release approved earlier is still to
        run. Opens a
        `manual_void` approval request; once a second admin with the finance
        role approves it, the void is sent after the commit with the key
        `void:{payment id}:{approval id}`. Every try asks Moyasar first and
        voids only while Moyasar shows the payment authorized; a payment
        Moyasar does not know is recorded as failed (`not_found`). A hold that
        still counts for a campaign is released by cancelling the
        participation or the campaign, never this way. There is no manual
        capture: captures go through closing the campaign, which issues the
        order and the invoice.
      x-epic: E15
      x-status: live
      x-permission: payments.void
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '201':
          description: The approval request (an existing one if it is already waiting).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ApprovalRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: '`not_voidable`: the hold still counts, its capture is under way, or it never reached Moyasar.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  /admin/refunds:
    get:
      tags: [Admin refunds and approvals]
      operationId: adminListRefunds
      summary: Refunds
      x-epic: E11
      x-status: live
      x-permission: payments.view
      security: [{adminToken: []}]
      parameters:
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/RefundStatus'}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of refunds.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Refund'}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    post:
      tags: [Admin refunds and approvals]
      operationId: adminRequestRefund
      summary: Request a refund
      description: |
        For returns within 7 days of delivery, shortages, damage or late
        delivery. Never more than captured minus what is already refunded or
        waiting to be. Starts as `pending_approval` with a `manual_refund`
        approval request, until a second admin with the finance role approves.
        `method` is `void` for a full refund within 2 hours of capture
        (`groupbuy.payments.void_after_capture_minutes`), otherwise `refund`.
        Without `customer_order_id` the refund is linked to the payment's order.
        Refunding everything left on an order that is `ready_to_ship` closes
        the order, so it is refused while a shipment the courier has not
        collected is open: cancel the shipment first.
      x-epic: E11
      x-status: live
      x-permission: refunds.request
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefundInput'}
      responses:
        '201':
          description: Created and waiting for approval.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/Refund'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: '`shipment_open`: a full refund of an order whose parcel is booked or waiting for the courier.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: '`refund_exceeds_captured`, `payment_not_captured`, `payment_not_found`, `order_not_for_payment`, or invalid input.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationError'}

  /admin/approval-requests:
    get:
      tags: [Admin refunds and approvals]
      operationId: adminListApprovalRequests
      summary: Actions waiting for a second admin
      x-epic: E15
      x-status: live
      x-permission: approvals.view
      security: [{adminToken: []}]
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [pending, approved, rejected, cancelled], default: pending}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: A page of approval requests.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/ApprovalRequest'}
                  meta: {$ref: '#/components/schemas/CursorMeta'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}

        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/approval-requests/{approval_request_id}/approve:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      tags: [Admin refunds and approvals]
      operationId: adminApproveRequest
      summary: Approve, then carry out the action
      description: >-
        The approver must hold the finance role and must not be the requester (403 `same_admin`).
        A `manual_refund` is then carried out after commit: Moyasar voids the hold while the payment can
        still be voided, otherwise refunds it; a credit note and ledger entries follow when it lands, and
        the refund shows `failed` if Moyasar refuses. An approved `campaign_cancellation` holds the
        campaign (no new capture, no closing step, no purchase order change) until it is carried out: it
        withdraws refund requests of its captured joins still pending (the refund becomes `rejected` and
        its approval request `cancelled`, both with the reason `campaign_cancelled`), sends no capture
        that has not already reached Moyasar, refunds everything left on every captured join, voids the remaining holds and cancels the orders
        and the purchase order. Other request types cannot be decided yet (409 `invalid_transition`), nor
        can a request that is no longer pending, or a campaign cancellation whose campaign can no longer be
        cancelled.
      x-epic: E15
      x-status: live
      x-permission: approvals.decide
      security: [{adminToken: []}]
      responses:
        '200':
          description: Approved; the action is queued.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ApprovalRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}

  /admin/approval-requests/{approval_request_id}/reject:
    parameters:
      - $ref: '#/components/parameters/ApprovalRequestId'
    post:
      tags: [Admin refunds and approvals]
      operationId: adminRejectRequest
      summary: Reject with a reason
      x-epic: E15
      x-status: live
      x-permission: approvals.decide
      security: [{adminToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonInput'}
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: {$ref: '#/components/schemas/ApprovalRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/InvalidTransition'}
        '422': {$ref: '#/components/responses/ValidationFailed'}

  # ---------------------------------------------------------------- Admin orders, purchasing, fulfilment
