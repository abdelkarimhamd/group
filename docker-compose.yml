services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: groupbuy
      POSTGRES_PASSWORD: groupbuy
      POSTGRES_DB: groupbuy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupbuy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Mock API generated from the contract, for frontend work before an
  # endpoint ships: docker compose --profile mock up api-mock
  api-mock:
    image: stoplight/prism:5
    profiles: [mock]
    command: mock -h 0.0.0.0 -p 4010 /contract/v1.yaml
    ports:
      - "127.0.0.1:4010:4010"
    volumes:
      - ./apps/api/openapi:/contract:ro

volumes:
  postgres-data:
